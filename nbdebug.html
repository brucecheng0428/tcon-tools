<!--
  NB TCON Debug應用（Bruce 2026-10-22，派工 238904982972174336）
  ・需求：E503 拉出 RX DE／TX DE 以實測過的設定為準（與其他資料有差異時以實測設定為主）；標題「NB TCON Debug應用」；
    「所有的 debug 我不要只限定在某一 pin 輸出，都要有下拉選單，可以從不同的 GPIO pin 輸出」；
    「網頁版的還需要可以有 I2C 即時操作，或者是匯出 NB 版的 Script，可以選擇 Excel 或是 Script 檔案」；
    「步驟要越簡單越好，說明要越少越好。就跟之前的 DG網頁或者是 DataMap 網頁的目標是一樣的，簡單明瞭、易操作」。
  ・主畫面：IC／項目／輸出 GPIO 三個下拉 → 一張暫存器表 → I2C 執行／還原／匯出 Excel／匯出 .script。來源、驗證等級用小標籤；細節收在「說明」。
  ・GPIO 清單：WPF ModelFiles 的 .model（RM8100x_for_FAE_20240925_20250311／RM81010_for_FAE_20240509_20241127／
    RM81011_for_FAE_20231025_20240509／RM81008）裡同一個父節點底下同時有 *_TX_EN 與 *_TX_IN_SEL 的全部列出，
    位址／bit／行號由程式從 .model 抽出（NBD_GPIO，行號存在 txL／selL）。封裝腳名來源：assistant_kb
    reference/NB_TCON_debug_TCON資料夾整理_20261022.md §5（datasheet Pin List）；查不到的標「封裝腳位待確認」。
  ・I2C：I2C Bridge（common/i2c-bridge.js 連線位址／徽章／下載提示；common/i2c-mbus.js M-Bus 導通 C-Bus），
    WebSocket 協定（ping／open／read／rawwrite／close）照 datamap.html；IC 辨認一律呼叫全站共用的 common/tcon-detect.js
    （TconDetect.detect），本頁不自己寫辨認流程或 ID 表。認不出時顯示讀到的原始值、改用畫面上選的 IC（v1.0.1）。
    🔴 不下 datamap 那一筆 E503 3E:0059←1E —— 0x059 正是 WP pin 的 TX_IN_SEL（實測用的輸出腳），下了會把 debug 輸出蓋掉。
    每一列都是「讀 → 只改遮罩內的 bit → 寫 → 讀回比對」；第一次寫前的原值記下來給「還原」。
  ・匯出：Excel 照 WFG NB 匯出（wfg.html wfgNbBuildXlsx：WFG_NB_XLSX_HEADER 22 欄、Check Item＝.model 區塊名、
    Offset 用 wfgNbOff 格式、值 '0x'+HEX）；.script 照 wfgNbBuildScript（write -m AAAA VV MM、// 註解、ASCII）。
  ・KOSC（EN01）：原廠腳本 Debug_OSC.i2cs＋EN01A1 osc calibration_1.i2cs（2026-10）；燒 eFuse（7C 0x01=01）預設不含，
    要勾「加入燒錄」＋兩個確認才會出現在表上／檔案裡；I2C 送出另外要求本次已讀 3E 0x20D0＝0。
-->

      '<li>' + esc(T3(['EN01 的內部 debug 群組沒有文件，只有 OSC（dbg_01 bit4）有實例對上；其他項目套 E503 做法＝推論。', 'EN01 internal debug groups are undocumented; only OSC (dbg_01 bit4) is confirmed; other items reuse the E503 method (inferred).', 'EN01 的内部 debug 群组没有文件，只有 OSC（dbg_01 bit4）有实例对上；其他项目套 E503 做法＝推论。'])) + '</li>' +
      '<li>' + esc(T3(['E501 的 TX_IN_SEL 26h／27h 是 BE／BS，不是 DEBUG_OUT[6]／[7]，所以 E501 沒有 PLL lock（Lane0）。', 'On E501 TX_IN_SEL 26h/27h are BE/BS, not DEBUG_OUT[6]/[7], so PLL lock (Lane0) is not offered.', 'E501 的 TX_IN_SEL 26h／27h 是 BE／BS，不是 DEBUG_OUT[6]／[7]，所以 E501 没有 PLL lock（Lane0）。'])) + '</li>' +
      '<li>' + esc(T3(['匯出 Excel／.script 是給 EN01 UI 載入（Excel＝Import CheckList；.script＝Script 分頁、Address Type＝Register）；7C 的列與 0x0E4 不是 .model 的 Register，.script 只寫成註解，要用 I2C 下。', 'Exports are for the EN01 UI (Excel = Import CheckList; .script = Script page, Address Type = Register); 7C rows and 0x0E4 are not .model registers, so .script keeps them as comments — send them by I2C.', '导出 Excel／.script 是给 EN01 UI 载入（Excel＝Import CheckList；.script＝Script 分页、Address Type＝Register）；7C 的行与 0x0E4 不是 .model 的 Register，.script 只写成注释，要用 I2C 下。'])) + '</li></ul>';
    $('nd-help').innerHTML = h;
  }

  /* ── I2C（協定同 datamap.html／i2c.html）── */
  var IB = window.I2CBridge || null;
  var WS_URL = IB ? IB.WS_URL : 'ws://127.0.0.1:8899/ws', WS_MS = 4000, CLOCK_HZ = 150000;
  function i2cState() { return S.linked ? 'on' : (S.busy && !S.linked ? 'busy' : (S.miss || 'off')); }
  function renderI2c() {
    if (IB) IB.badge($('nd-i2c'), i2cState());
    var need = $('nd-need');
    if (IB && S.miss && !S.linked) { if (need.getAttribute('data-i2cb-need') !== S.miss || need.getAttribute('data-lang') !== document.documentElement.lang) { IB.mountNeed(need, S.miss); need.setAttribute('data-lang', document.documentElement.lang); } }
    else if (IB) IB.unmountNeed(need);
  }
  function send(obj) {
    return new Promise(function (resolve, reject) {
      if (!S.ws || S.ws.readyState !== 1) { reject(new Error(tt('nd.needLink'))); return; }
      var id = ++S.seq; obj.id = id;
      var timer = setTimeout(function () { if (S.pend[id]) { delete S.pend[id]; reject(new Error('timeout: ' + obj.type)); } }, WS_MS);
      S.pend[id] = { resolve: resolve, reject: reject, timer: timer };
      try { S.ws.send(JSON.stringify(obj)); } catch (e) { clearTimeout(timer); delete S.pend[id]; reject(e); }
    });
  }
  async function rawRead(slave, awid, addr, len) {
    var r = await send({ type: 'read', slave: slave, addr: addr, len: len, awid: awid });
    if (!r.ok) throw new Error('read 0x' + hex(slave, 2) + ':0x' + hex(addr, 4) + ' fail' + (r.err ? ' ' + r.err : ''));
    return r.data || [];
  }
  async function rawWrite(slave, awid, addr, bytes) {
    var r = await send({ type: 'rawwrite', slave: slave, addr: addr, data: bytes.map(function (x) { return x & 0xFF; }), awid: awid });
    if (!r.ok) {
      if (r.err && /unknown|type/i.test(String(r.err))) throw new Error(tt('nd.oldBridge'));
      throw new Error('write 0x' + hex(slave, 2) + ':0x' + hex(addr, 4) + ' fail' + (r.err ? ' ' + r.err : ''));
    }
    return r;
  }
  /* IC 辨認：一律呼叫全站共用的 TconDetect.detect（common/tcon-detect.js），本頁不自己寫辨認流程或 ID 表。
     回 { ic }＝本頁支援的型號；{ other }＝認到但本頁不支援；{ none, amb, raw }＝認不出／分不出（改用畫面上選的 IC）。 */
  async function checkIc() {
    var io = { read: async function (s, aw, a, n) { try { return await rawRead(s, aw, a, n); } catch (e) { return null; } }, write: rawWrite };
    var r = await TconDetect.detect(io, { log: log });
    S.det = r;
    var fams = (r.alts && (r.ambiguous || r.conflict)) ? r.alts.map(TconDetect.familyOfName) : [r.family];
    var one = fams.every(function (f) { return f && f === fams[0]; }) ? fams[0] : null;
    if (one && G[one]) return { ic: one };
    if (one && !r.unknown) return { other: r.name };
    return { none: true, amb: (r.ambiguous || r.conflict) ? (r.alts || []).join('／') : '', raw: r.rawText || '—' };
  }
  async function connect() {
    if (S.linked) return disconnect();
    if (S.busy) return;
    S.busy = true; S.userClose = false; S.miss = null; render();
    log('connect ' + WS_URL);
    var ws;
    try { ws = new WebSocket(WS_URL); } catch (e) { S.busy = false; S.miss = 'none'; status(tt('nd.linkErr'), 'err'); render(); return; }
    S.ws = ws;
    ws.onmessage = function (ev) { var m; try { m = JSON.parse(ev.data); } catch (e) { return; } if (typeof m.id === 'number' && S.pend[m.id]) { var p = S.pend[m.id]; delete S.pend[m.id]; clearTimeout(p.timer); p.resolve(m); } };
    ws.onclose = function () {
      for (var k in S.pend) { try { clearTimeout(S.pend[k].timer); S.pend[k].reject(new Error('closed')); } catch (e) {} }
      S.pend = {}; if (S.linked && !S.userClose) S.miss = 'drop';
      S.linked = false; S.ws = null; S.checked = null; S.manual = false; render();
    };
    var opened = await new Promise(function (res) {
      var done = false, to = setTimeout(function () { if (!done) { done = true; res(false); } }, WS_MS);
      ws.onopen = function () { if (!done) { done = true; clearTimeout(to); res(true); } };
      ws.onerror = function () { if (!done) { done = true; clearTimeout(to); res(false); } };
    });
    if (!opened) { try { ws.close(); } catch (e) {} S.ws = null; S.busy = false; S.miss = 'none'; status(tt('nd.linkErr'), 'err'); render(); return; }
    try {
      var pong = await send({ type: 'ping' }); log('I2C Bridge ' + (pong.helper || '?') + ' proto ' + (pong.proto || '?'));
      var op = null;
      for (var a = 1; a <= 5; a++) {
        op = await send({ type: 'open', page: 'nbdebug ' + ((window.TOOL_VERSIONS && TOOL_VERSIONS.nbdebug) || ''), clockHz: CLOCK_HZ, takeover: 1, fastread: 0 });
        if (op && op.locked) throw new Error('I2C Bridge locked by another page');
        if (op && op.ok) break;
        await new Promise(function (r) { setTimeout(r, 500); });
      }
      if (!op || !op.ok) throw new Error('open failed');
      S.linked = true; log('channel open');
      var res = await checkIc(), ic = res.ic || null; S.checked = ic; S.manual = !!res.none;
      if (res.other) { $('nd-ic').textContent = tt('nd.icOther', { ic: res.other }); status(tt('nd.icOther', { ic: res.other }), 'err'); }
      else if (!ic) {
        var m = res.amb ? tt('nd.icAmb', { a: res.amb, raw: res.raw }) : tt('nd.icNone', { raw: res.raw });
        $('nd-ic').textContent = tt('nd.icManual', { ic: $('nd-icsel').value }); status(m, 'err'); log(m);
      }
      else if (ic !== $('nd-icsel').value) { $('nd-icsel').value = ic; onIc(); $('nd-ic').textContent = tt('nd.icGot', { ic: ic }); status(tt('nd.icSwitch', { ic: ic }), 'ok'); }
      else { $('nd-ic').textContent = tt('nd.icGot', { ic: ic }); status(''); }
    } catch (e) {
      status(String(e && e.message || e), 'err'); S.userClose = true;
      try { send({ type: 'close' }).catch(function () {}); } catch (e2) {}
      try { ws.close(); } catch (e3) {}
      S.linked = false; S.ws = null;
    } finally { S.busy = false; render(); }
  }
  async function disconnect() {
    S.userClose = true; S.miss = null;
    try { if (S.ws && S.ws.readyState === 1) await send({ type: 'close' }); } catch (e) {}
    try { if (S.ws) S.ws.close(); } catch (e) {}
    S.ws = null; S.linked = false; S.checked = null; S.manual = false; $('nd-ic').textContent = ''; log('disconnected'); render();
  }
  /* 認到 ⇒ 只能照認到的型號下；認不出 ⇒ 照使用者在畫面上選的 IC 下（不擋住使用） */
  function icOk() { return !!(S.linked && ((S.checked && S.checked === $('nd-icsel').value) || (!S.checked && S.manual))); }
  function icWhy() {
    if (S.checked && S.checked !== $('nd-icsel').value) return tt('nd.icMismatch', { ic: S.checked });
    var d = S.det; return d && !d.unknown && d.name ? tt('nd.icOther', { ic: d.name }) : tt('nd.icNone', { raw: (d && d.rawText) || '—' });
  }
  /* 一列：讀 → 只改遮罩內 bit → 寫 → 讀回比對；第一次寫前的原值記到 S.orig（還原用） */
  async function doRow(b, i, mode) {
    var r = b.rows[i], aw = r.ob;
    if (mode === 'r' || r.kind === 'r') {
      var v = (await rawRead(r.slave, aw, r.addr, 1))[0] & 0xFF;
      log('R 0x' + hex(r.slave, 2) + ':0x' + hex(r.addr, aw === 2 ? 4 : 2) + ' -> ' + hex(v, 2));
      if (r.kind === 'r') { S.r20d0 = v; S.rb[i] = { t: '0x' + hex(v, 2) + ' ' + tt(v ? 'nd.burned' : 'nd.notBurned'), cls: v ? 'ng' : 'ok' }; return true; }
      var got = (v & r.mask) >> r.lsb;
      S.rb[i] = r.rbUnk ? { t: '0x' + hex(v, 2) + ' ' + tt('nd.rbUnk'), cls: 'mid' } : { t: '0x' + hex(v, 2) + (got === r.val ? ' ✓' : ' ✗'), cls: got === r.val ? 'ok' : 'ng' };
      return r.rbUnk || got === r.val;
    }
    if (r.kind === 'burn') {
      if (!S.burnOk()) throw new Error(tt('nd.burnAdd'));
      if (S.r20d0 !== 0) throw new Error(tt('nd.burnNeed20d0'));
    }
    var old = (await rawRead(r.slave, aw, r.addr, 1))[0] & 0xFF;
    var k = key(r); if (!(k in S.orig) && r.kind !== 'burn') S.orig[k] = { slave: r.slave, ob: aw, addr: r.addr, v: old, order: Object.keys(S.orig).length };
    var nv = (old & ~r.mask & 0xFF) | ((r.val << r.lsb) & r.mask);
    await rawWrite(r.slave, aw, r.addr, [nv]);
    log('W 0x' + hex(r.slave, 2) + ':0x' + hex(r.addr, aw === 2 ? 4 : 2) + ' ' + hex(old, 2) + ' -> ' + hex(nv, 2) + ' (mask ' + hex(r.mask, 2) + ')');
    if (r.kind === 'burn') { S.rb[i] = { t: 'sent', cls: 'mid' }; return true; }
    return await doRow(b, i, 'r');
  }
  async function guard(fn) {
    if (!S.linked) { status(tt('nd.needLink'), 'err'); return; }
    if (!icOk()) { status(icWhy(), 'err'); return; }
    if (S.busy) return;
    S.busy = true; status(tt('nd.busy')); render();
    try { await fn(); } catch (e) { status(String(e && e.message || e), 'err'); log('ERR ' + (e && e.message || e)); }
    finally { S.busy = false; render(); }
  }
  function runAll() {
    return guard(async function () {
      var b = cur(), n = 0; S.rb = {};
      var mb = await TconMbus.open(rawWrite); if (!mb.ok) log(tt('tcon.mbusFail', { err: mb.err }));
      for (var i = 0; i < b.rows.length; i++) {
        var ok = await doRow(b, i, 'w'); render();
        if (b.rows[i].kind === 'r' && S.r20d0) { /* 已燒過：照樣讓使用者量頻，但燒錄列一定不送 */ }
        if (!ok) { status(tt('nd.runFail', { i: i + 1 }), 'err'); return; }
        if (b.rows[i].kind !== 'r') n++;
      }
      status(tt('nd.runOk', { n: n }), 'ok');
    });
  }
  function undo() {
    return guard(async function () {
      var list = Object.keys(S.orig).map(function (k) { return S.orig[k]; }).sort(function (a, b) { return b.order - a.order; });
      if (!list.length) { status(tt('nd.undoNone')); return; }
      for (var i = 0; i < list.length; i++) { var o = list[i]; await rawWrite(o.slave, o.ob, o.addr, [o.v]); log('W 0x' + hex(o.slave, 2) + ':0x' + hex(o.addr, o.ob === 2 ? 4 : 2) + ' <- ' + hex(o.v, 2) + ' (restore)'); }
      S.orig = {}; S.rb = {}; status(tt('nd.undoOk', { n: list.length }), 'ok');
    });
  }

  /* ── 事件 ── */
  function onIc() {
    fillItems(); fillGpio(false); S.rb = {};
    if (S.linked && S.checked && S.checked !== $('nd-icsel').value) $('nd-ic').textContent = tt('nd.icGot', { ic: S.checked });
    else if (S.linked && !S.checked && S.manual) $('nd-ic').textContent = tt('nd.icManual', { ic: $('nd-icsel').value });
    render();
  }
  $('nd-icsel').addEventListener('change', onIc);
  $('nd-item').addEventListener('change', function () { fillGpio(false); S.rb = {}; render(); });
  $('nd-gpio').addEventListener('change', function () { S.rb = {}; render(); });
  $('nd-link').addEventListener('click', connect);
  $('nd-run').addEventListener('click', runAll);
  $('nd-undo').addEventListener('click', undo);
  ['nd-burn', 'nd-burn1', 'nd-burn2'].forEach(function (id) { $(id).addEventListener('change', function () { if (id === 'nd-burn' && !$('nd-burn').checked) { $('nd-burn1').checked = false; $('nd-burn2').checked = false; } S.rb = {}; render(); }); });
  $('nd-tbl').addEventListener('click', function (e) {
    var t0 = e.target.closest('button'); if (!t0) return;
    var i = +(t0.getAttribute('data-w') || t0.getAttribute('data-r')), mode = t0.hasAttribute('data-w') ? 'w' : 'r';
    guard(async function () { await TconMbus.open(rawWrite); var ok = await doRow(cur(), i, mode); render(); if (!ok) status(tt('nd.runFail', { i: i + 1 }), 'err'); else status(''); });
  });
  $('nd-xlsx').addEventListener('click', function () {
    var b = cur(), f = fname(b, 'xlsx');
    download(f, TCONXlsx.build([{ name: 'Sheet1', rows: xlsxRows(b) }]), 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
    status(tt('nd.exported', { f: f }), 'ok'); log('export ' + f);
  });
  $('nd-script').addEventListener('click', function () {
    var b = cur(), f = fname(b, 'script');
    download(f, scriptText(b), 'text/plain');
    status(tt('nd.exported', { f: f }), 'ok'); log('export ' + f);
  });
  window._onLangChange = function () { fillGpio(true); render(); };

  fillIc(); fillItems(); fillGpio(false);
  render();
  /* 測試／除錯入口（不在畫面上） */
  window.NBD = { build: build, xlsxRows: xlsxRows, scriptText: scriptText, fname: fname, items: ITEMS, itemsFor: itemsFor, defPin: defPin, XLSX_HEADER: XLSX_HEADER, S: S, render: render };
})();
</script>
