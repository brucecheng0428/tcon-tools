<!--
  NB TCON Debug應用（Bruce 2026-10-22，派工 238904982972174336）
  ・需求：E503 拉出 RX DE／TX DE 以實測過的設定為準（與其他資料有差異時以實測設定為主）；標題「NB TCON Debug應用」；
    「所有的 debug 我不要只限定在某一 pin 輸出，都要有下拉選單，可以從不同的 GPIO pin 輸出」；
    「網頁版的還需要可以有 I2C 即時操作，或者是匯出 NB 版的 Script，可以選擇 Excel 或是 Script 檔案」；
    「步驟要越簡單越好，說明要越少越好。就跟之前的 DG網頁或者是 DataMap 網頁的目標是一樣的，簡單明瞭、易操作」。
  ・主畫面：IC／項目／輸出 GPIO 三個下拉 → 一張暫存器表 → I2C 執行／還原／匯出 Excel／匯出 .script。細節收在「說明」。v1.1.3（Bruce 2026-10-23）：不顯示來源／驗證等級（原本 IC 下拉下面那一列整列拿掉）；v1.1.4：量測提示也不放「說明」；等級與出處只留在 assistant_kb/debugmode。
  ・GPIO 清單：WPF ModelFiles 的 .model（RM8100x_for_FAE_20240925_20250311／RM81010_for_FAE_20240509_20241127／
    RM81011_for_FAE_20231025_20240509／RM81008）裡同一個父節點底下同時有 *_TX_EN 與 *_TX_IN_SEL 的全部列出，
    位址／bit／行號由程式從 .model 抽出（NBD_GPIO，行號存在 txL／selL）。封裝腳名來源：assistant_kb
    reference/NB_TCON_debug_TCON資料夾整理_20261022.md §5（datasheet Pin List）；EN01 v1.1.4 起照原廠 pin 腳分配表（EN01A1 Q5_QFN60_3.5x9，20 支全有）
    顯示「pin 號＋腳上名稱（暫存器名）」，腳名≠暫存器名的 4 支（pin 2／31／32／58）加註；查不到的（E501A／B 部分）標「封裝腳位待確認」。
  ・I2C：I2C and AUX Bridge（common/i2c-bridge.js 連線位址／徽章／下載提示；common/i2c-mbus.js M-Bus 導通 C-Bus），
    WebSocket 協定（ping／open／read／rawwrite／close）照 datamap.html；IC 辨認一律呼叫全站共用的 common/tcon-detect.js（TconDetect.detect，v1.1.1）。
    🔴 不下 datamap 那一筆 E503 3E:0059←1E —— 0x059 正是 WP pin 的 TX_IN_SEL（實測用的輸出腳），下了會把 debug 輸出蓋掉。
    每一列都是「讀 → 只改遮罩內的 bit → 寫 → 讀回比對」；第一次寫前的原值記下來給「還原」。
  ・匯出：Excel 照 WFG NB 匯出（wfg.html wfgNbBuildXlsx：WFG_NB_XLSX_HEADER 22 欄、Check Item＝.model 區塊名、
    Offset 用 wfgNbOff 格式、值 '0x'+HEX）；.script 照 wfgNbBuildScript（write -m AAAA VV MM、// 註解、ASCII）。
  ・KOSC（EN01）：原廠腳本 Debug_OSC.i2cs＋EN01A1 osc calibration_1.i2cs（2026-10）；燒 eFuse（7C 0x01=01）預設不含，
    要勾「加入燒錄」＋兩個確認才會出現在表上／檔案裡；I2C 送出另外要求本次已讀 3E 0x20D0＝0。
  ・v1.2.0 KOSC 一步一步引導（Bruce 2026-10-23：「在 debug 應用這個地方，可以多一個選項讓使用者選擇是否需要一步一步引導」）：
    KOSC 項目多一個開關；① 讀 20D0 → ② Debug OSC → ③ 寫 trim 值 → ④ 只填量到的頻率、不合格自動算下一個值並預填、每輪留紀錄
    → ⑤ 合格才出現燒錄（同一組三格確認、燒前再讀 20D0）→ ⑥ 上下電後只下 ②、量頻、讀 20D0 非 0。程式在 guideSuggest／renderGuide。
-->

  /* v1.1.2（Bruce 2026-10-22「所有用到 I2C 的網頁都應該要修正喔」）：每一則訊息先經過全站共用的 TconMbus.session

  async function rawRead(slave, awid, addr, len) {

    if (!r.ok) {

    var cls = function (n) { var s = gs[n - 1]; return 'nd-gst ' + (s === 'done' ? 'done' : (s === 'cur' || s === 'err' ? 'cur' : (s === 'skip' ? 'skip' : 'wait'))) + (n === 5 ? ' nd-gburn' : ''); };
    /* v1.2.1：已完成＝綠色實心圓 ✓（標題前）＋「已完成」（標題右側）；不需要＝灰色「不需要」；⑤ 一直標「⚠ 不可逆」 */
    var ico = function (n) { return gs[n - 1] === 'done' ? '<span class="tc-done-ico" aria-hidden="true">✓</span>' : ''; };
    var mark = function (n) { var s = gs[n - 1]; return (n === 5 && s !== 'skip' && s !== 'done' ? ' <span class="nd-gwarn">' + esc(tt('nd.gIrrev')) + '</span>' : '') + (s === 'done' ? ' <span class="nd-gchip ok">' + esc(TCONStepStatus.txt('done')) + '</span>' : (s === 'skip' ? ' <span class="nd-gchip skip">' + esc(TCONStepStatus.txt('skip')) + '</span>' : '')); };
    var btn = function (act, label, opt) { return '<button class="sbtn sm' + (opt === 'pri' ? ' pri' : '') + '" data-g="' + act + '"' + (opt === 'free' ? '' : io) + '>' + esc(label) + '</button>'; };
    var res = function (txt, c) { return '<span class="nd-gres ' + c + '">' + esc(txt) + '</span>'; };
    var hx = function (v) { return '0x' + hex(v, 2); };
    var h = '';
    /* ① */
    h += '<div class="' + cls(1) + '" data-gs="1"><h5>' + ico(1) + esc(tt('nd.g1T')) + mark(1) + ref(rs.r) + '</h5><p>' + esc(tt('nd.g1P')) + '</p><div class="nd-grow">' + btn('read', tt('nd.gRead'), st === 1 ? 'pri' : '') +
      (g.r0 != null ? res(hx(g.r0) + ' ' + tt(g.r0 ? 'nd.burned' : 'nd.notBurned'), g.r0 ? 'ng' : 'ok') : '') + '</div></div>';
    /* ② */
    h += '<div class="' + cls(2) + '" data-gs="2"><h5>' + ico(2) + esc(tt('nd.g2T')) + mark(2) + ref(rs.dbg) + '</h5><p>' + tt('nd.g2P', { p: esc(pinText(b.gpios[0])) }) + '</p><div class="nd-grow">' + btn('dbg', tt('nd.gWrite'), st === 2 ? 'pri' : '') + '</div></div>';
    /* ③ */
    h += '<div class="' + cls(3) + '" data-gs="3"><h5>' + ico(3) + esc(tt('nd.g3T')) + mark(3) + ref(rs.cal) + '</h5><p>' + tt('nd.g3P', { v: hx(S.code) }) + '</p><div class="nd-grow">' + btn('cal', tt('nd.gWrite'), st === 3 ? 'pri' : '') + '</div></div>';
    /* ④ */
    var l = g.rounds[g.rounds.length - 1], s4 = '';
    if (l) {
      var d = (l.f - G_TARGET) / G_TARGET * 100;
      s4 += '<div class="nd-grow">' + res('#' + l.n + '　' + hx(l.code) + ' → ' + l.f + ' MHz（' + gDevTxt(l.f) + '）' + (l.ok ? tt('nd.gPass') : tt(d > 0 ? 'nd.gHigh' : 'nd.gLow')), l.ok ? 'ok' : 'ng') + '</div>';
      var sg = g.sug;
      if (!l.ok && sg) {
        if (/^(probe|interp|slope)$/.test(sg.why)) {
          var wrote = g.wcode === S.code && l.code !== g.wcode;
          s4 += '<div class="nd-grow">' + (wrote ? res(tt('nd.gWrote', { v: hx(S.code) }), 'mid') : res(tt('nd.gNext', { v: hx(S.code) }) + (sg.why === 'probe' ? tt('nd.gProbe') : ''), 'mid') + ' ' + btn('cal', tt('nd.gNextBtn', { v: hx(S.code) }), 'pri')) + '</div>';
        } else if (sg.why === 'flat') s4 += '<div class="nd-grow">' + res(tt('nd.gFlat'), 'ng') + '</div>';
        else s4 += '<div class="nd-grow">' + res(tt(sg.why === 'edge' ? 'nd.gEdge' : 'nd.gBest', { v: hx(sg.code), t: G_TARGET }), 'ng') + '</div>';
      }
      if (sg && sg.dir) s4 += '<div class="nd-grow" style="font-size:12px;color:var(--sub)">' + esc(tt(sg.dir > 0 ? 'nd.gDirUp' : 'nd.gDirDn')) + '</div>';
      s4 += '<table class="nd-gtbl"><thead><tr><th>' + esc(tt('nd.gThN')) + '</th><th>' + esc(tt('nd.gThCode')) + '</th><th>' + esc(tt('nd.gThF')) + '</th><th>' + esc(tt('nd.gThDev')) + '</th><th>' + esc(tt('nd.gThRes')) + '</th></tr></thead><tbody>' +
        g.rounds.map(function (r) { return '<tr><td>' + r.n + '</td><td class="nd-mono">' + hx(r.code) + '</td><td class="nd-mono">' + r.f + '</td><td class="nd-mono">' + gDevTxt(r.f) + '</td><td>' + res(r.ok ? tt('nd.gPass') : tt(r.f > G_TARGET ? 'nd.gHigh' : 'nd.gLow'), r.ok ? 'ok' : 'ng') + '</td></tr>'; }).join('') + '</tbody></table>';
    }
    h += '<div class="' + cls(4) + '" data-gs="4"><h5>' + ico(4) + esc(tt('nd.g4T')) + mark(4) + '</h5><p>' + esc(tt('nd.g4P', { t: G_TARGET })) + '</p>' +
      '<div class="nd-grow"><input class="nd-in nd-gin" id="nd-gf" inputmode="decimal" placeholder="' + G_TARGET.toFixed(2) + '" value="' + esc(g.fin) + '" aria-label="MHz"> MHz ' + btn('meas', tt('nd.gOkBtn'), 'free') +
      '<span style="margin-left:8px">' + esc(tt('nd.gTol')) + '<input class="nd-in" id="nd-gtol" inputmode="decimal" value="' + esc(g.tol) + '" style="width:48px" aria-label="%"> %</span></div>' +
      '<div class="nd-grow" style="font-size:12px;color:var(--sub)">' + esc(tt('nd.gTolNote')) + '</div>' + s4 + '</div>';
    /* ⑤ */
    var s5;
    if (g.burned) s5 = '<div class="nd-grow">' + res(tt('nd.g5Done') + '　' + hx(g.bcode), 'ok') + '</div>';
    else if (S.r20d0 != null && S.r20d0 !== 0) s5 = '<p>' + esc(tt('nd.g5Skip')) + '</p>';
    else if (!gCanBurn()) s5 = '<p>' + esc(tt('nd.g5Wait')) + '</p>';
    else s5 = '<p>' + tt('nd.g5P', { v: hx(S.code) }) + '</p><div id="nd-g5slot"></div><div class="nd-grow">' + (S.burnOk() ? btn('burn', tt('nd.g5Btn'), 'pri') : '<button class="sbtn sm" disabled>' + esc(tt('nd.g5Btn')) + '</button> ' + res(tt('nd.g5Need'), 'mid')) + '</div>';
    h += '<div class="' + cls(5) + '" data-gs="5"><h5>' + ico(5) + esc(tt('nd.g5T')) + mark(5) + ref(rs.burn) + '</h5>' + s5 + '</div>';
    /* ⑥ */
    var s6 = '<p>' + esc(tt(gs[5] === 'skip' ? 'nd.gSkipT' : 'nd.g6P')) + '</p>';
    if (g.burned) {
      s6 += '<div class="nd-grow">' + btn('pdbg', tt('nd.gWrite'), st === 6 && !g.p2 ? 'pri' : '') + (g.p2 ? res('✓', 'ok') : '') + '</div>' +
        '<div class="nd-grow"><input class="nd-in nd-gin" id="nd-gpf" inputmode="decimal" placeholder="' + G_TARGET.toFixed(2) + '" value="' + esc(g.pfin) + '" aria-label="MHz"> MHz ' + btn('pmeas', tt('nd.gOkBtn'), 'free') +
        (g.pf != null ? ' ' + res(g.pf + ' MHz（' + gDevTxt(g.pf) + '）' + (g.pok ? tt('nd.gPass') : tt(g.pf > G_TARGET ? 'nd.gHigh' : 'nd.gLow')), g.pok ? 'ok' : 'ng') : '') + '</div>' +
        '<div class="nd-grow">' + btn('pread', tt('nd.gRead') + ' 0x20D0', st === 6 && g.pf != null ? 'pri' : '') + (g.pr != null ? ' ' + res(hx(g.pr) + ' ' + tt(g.pr ? 'nd.g6Done' : 'nd.g6Not'), g.pr ? 'ok' : 'ng') : '') + '</div>';
    }
    h += '<div class="' + cls(6) + '" data-gs="6"><h5>' + ico(6) + esc(tt('nd.g6T')) + mark(6) + (g.burned ? ref([rs.r, rs.dbg]) : '') + '</h5>' + s6 + '</div>';
    h += '<div class="nd-gst"><div class="nd-grow">' + btn('copy', tt('nd.gCopy'), 'free') + btn('reset', tt('nd.gReset'), 'free') + '</div></div>';
    pan.innerHTML = h;   /* v1.2.2：步驟列 #nd-gbar 移到引導區塊外面（固定在最上方用），不再重畫進 pan */
    var slot = $('nd-g5slot'); if (slot) slot.appendChild(box);
    /* v1.2.1：頂部步驟列＋目前這一步加框（common/step-status.js；狀態全部來自 gStates()） */
    var SN = ['nd.g1T', 'nd.g2T', 'nd.g3T', 'nd.g4T', 'nd.g5T', 'nd.g6T'];
    var steps = gs.map(function (s, i) { return { name: String(tt(SN[i])).replace(/^[①②③④⑤⑥]\s*/, ''), short: tt('nd.gS' + (i + 1)), state: s === 'err' ? 'cur' : s }; });
    TCONStepStatus.bar($('nd-gbar'), steps);
    var ci = steps.map(function (s) { return s.state; }).indexOf('cur');
    if (ci >= 0) TCONStepStatus.cur(pan.querySelector('.nd-gst[data-gs="' + (ci + 1) + '"]'), { no: ci + 1, total: 6 });
  }

  /* ── 事件 ── */
  function onIc() {
    fillItems(); fillGpio(false); S.rb = {};
    if (S.linked && S.checked && S.checked !== $('nd-icsel').value) $('nd-ic').textContent = tt('nd.icGot', { ic: S.checked });
    else if (S.linked && !S.checked && S.manual) $('nd-ic').textContent = tt('nd.icManual', { ic: $('nd-icsel').value });
    render();
  }
  $('nd-icsel').addEventListener('change', onIc);
  $('nd-item').addEventListener('change', function () { fillGpio(false); S.rb = {}; render(); });
  $('nd-q').addEventListener('input', function () { fillItems(); fillGpio(false); S.rb = {}; render(); });
  $('nd-gpios').addEventListener('change', function () { S.rb = {}; render(); });
  $('nd-link').addEventListener('click', connect);
  $('nd-run').addEventListener('click', runAll);
  $('nd-undo').addEventListener('click', undo);
  $('nd-guide').addEventListener('change', function () { S.g.on = $('nd-guide').checked; render(); });
  $('nd-gpanel').addEventListener('click', function (e) { var bt = e.target.closest('button[data-g]'); if (bt && !bt.disabled) gAct(bt.getAttribute('data-g')); });
  $('nd-gpanel').addEventListener('input', function (e) { var id = e.target.id; if (id === 'nd-gf') S.g.fin = e.target.value; else if (id === 'nd-gpf') S.g.pfin = e.target.value; else if (id === 'nd-gtol') S.g.tol = e.target.value; });
  $('nd-gpanel').addEventListener('change', function (e) { if (e.target.id === 'nd-gtol') { gJudgeLast(); render(); } });
  $('nd-gpanel').addEventListener('keydown', function (e) { if (e.key !== 'Enter') return; if (e.target.id === 'nd-gf') gMeas(); else if (e.target.id === 'nd-gpf') gPMeas(); });
  ['nd-burn', 'nd-burn1', 'nd-burn2'].forEach(function (id) { $(id).addEventListener('change', function () { if (id === 'nd-burn' && !$('nd-burn').checked) { $('nd-burn1').checked = false; $('nd-burn2').checked = false; } S.rb = {}; render(); }); });
  $('nd-tbl').addEventListener('click', function (e) {
    var t0 = e.target.closest('button'); if (!t0) return;
    var i = +(t0.getAttribute('data-w') || t0.getAttribute('data-r')), mode = t0.hasAttribute('data-w') ? 'w' : 'r';
    guard(async function () { var bb = cur(); if (!bb.item.mbus) await TconMbus.open(rawWrite); var ok = await doRow(bb, i, mode); render(); if (!ok) status(tt('nd.runFail', { i: i + 1 }), 'err'); else status(''); });
  });
  $('nd-xlsx').addEventListener('click', function () {
    var b = cur(), f = fname(b, 'xlsx');
    download(f, TCONXlsx.build([{ name: 'Sheet1', rows: xlsxRows(b) }]), 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
    status(tt('nd.exported', { f: f }), 'ok'); log('export ' + f);
  });
  $('nd-script').addEventListener('click', function () {
    var b = cur(), f = fname(b, 'script');
    download(f, scriptText(b), 'text/plain');
    status(tt('nd.exported', { f: f }), 'ok'); log('export ' + f);
  });
  window._onLangChange = function () { $('nd-q').placeholder = tt('nd.qPh'); fillItems(); fillGpio(true); render(); };

  $('nd-q').placeholder = tt('nd.qPh');
  TconMbus.romSelect($('nd-rom'));
  $('nd-rom').addEventListener('change', function () { S.rb = {}; render(); });
  $('nd-rom').addEventListener('tconrom-sync', function () { render(); });
  fillIc(); fillItems(); fillGpio(false);
  render();
  /* 測試／除錯入口（不在畫面上） */
  window.NBD = { build: build, xlsxRows: xlsxRows, scriptText: scriptText, fname: fname, items: ITEMS, itemsFor: itemsFor, allItems: allItems, defPin: defPin, defPins: defPins, groups: NBD_GROUPS, XLSX_HEADER: XLSX_HEADER, S: S, render: render, guideSuggest: guideSuggest, gStep: gStep, gStates: gStates, gLogText: gLogText };
})();
</script>
</body>
