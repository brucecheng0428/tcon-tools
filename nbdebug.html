<!--
  NB TCON Debug應用（Bruce 2026-10-22，派工 238904982972174336）
  ・需求：E503 拉出 RX DE／TX DE 以實測過的設定為準（與其他資料有差異時以實測設定為主）；標題「NB TCON Debug應用」；
    「所有的 debug 我不要只限定在某一 pin 輸出，都要有下拉選單，可以從不同的 GPIO pin 輸出」；
    「網頁版的還需要可以有 I2C 即時操作，或者是匯出 NB 版的 Script，可以選擇 Excel 或是 Script 檔案」；
    「步驟要越簡單越好，說明要越少越好。就跟之前的 DG網頁或者是 DataMap 網頁的目標是一樣的，簡單明瞭、易操作」。
  ・主畫面：IC／項目／輸出 GPIO 三個下拉 → 一張暫存器表 → I2C 執行／還原／匯出 Excel／匯出 .script。來源、驗證等級用小標籤；細節收在「說明」。
  ・GPIO 清單：WPF ModelFiles 的 .model（RM8100x_for_FAE_20240925_20250311／RM81010_for_FAE_20240509_20241127／
    RM81011_for_FAE_20231025_20240509／RM81008）裡同一個父節點底下同時有 *_TX_EN 與 *_TX_IN_SEL 的全部列出，
    位址／bit／行號由程式從 .model 抽出（NBD_GPIO，行號存在 txL／selL）。封裝腳名來源：assistant_kb
    reference/NB_TCON_debug_TCON資料夾整理_20261022.md §5（datasheet Pin List）；查不到的標「封裝腳位待確認」。
  ・I2C：I2C Bridge（common/i2c-bridge.js 連線位址／徽章／下載提示；common/i2c-mbus.js M-Bus 導通 C-Bus），
    WebSocket 協定（ping／open／read／rawwrite／close）照 datamap.html；IC 辨認一律呼叫全站共用的 common/tcon-detect.js
    （TconDetect.detect），本頁不自己寫辨認流程或 ID 表。認不出時顯示讀到的原始值、改用畫面上選的 IC（v1.0.1）。
    🔴 不下 datamap 那一筆 E503 3E:0059←1E —— 0x059 正是 WP pin 的 TX_IN_SEL（實測用的輸出腳），下了會把 debug 輸出蓋掉。
    每一列都是「讀 → 只改遮罩內的 bit → 寫 → 讀回比對」；第一次寫前的原值記下來給「還原」。
  ・匯出：Excel 照 WFG NB 匯出（wfg.html wfgNbBuildXlsx：WFG_NB_XLSX_HEADER 22 欄、Check Item＝.model 區塊名、
    Offset 用 wfgNbOff 格式、值 '0x'+HEX）；.script 照 wfgNbBuildScript（write -m AAAA VV MM、// 註解、ASCII）。
  ・KOSC（EN01）：原廠腳本 Debug_OSC.i2cs＋EN01A1 osc calibration_1.i2cs（2026-10）；燒 eFuse（7C 0x01=01）預設不含，
    要勾「加入燒錄」＋兩個確認才會出現在表上／檔案裡；I2C 送出另外要求本次已讀 3E 0x20D0＝0。
-->

      var v = (await rawRead(r.slave, aw, r.addr, 1))[0] & 0xFF;
      log('R 0x' + hex(r.slave, 2) + ':0x' + hex(r.addr, aw === 2 ? 4 : 2) + ' -> ' + hex(v, 2));
      if (r.kind === 'r') { S.r20d0 = v; S.rb[i] = { t: '0x' + hex(v, 2) + ' ' + tt(v ? 'nd.burned' : 'nd.notBurned'), cls: v ? 'ng' : 'ok' }; return true; }
      var got = (v & r.mask) >> r.lsb;
      S.rb[i] = r.rbUnk ? { t: '0x' + hex(v, 2) + ' ' + tt('nd.rbUnk'), cls: 'mid' } : { t: '0x' + hex(v, 2) + (got === r.val ? ' ✓' : ' ✗'), cls: got === r.val ? 'ok' : 'ng' };
      return r.rbUnk || got === r.val;
    }
    if (r.kind === 'burn') {
      if (!S.burnOk()) throw new Error(tt('nd.burnAdd'));
      if (S.r20d0 !== 0) throw new Error(tt('nd.burnNeed20d0'));
    }
    var old = (await rawRead(r.slave, aw, r.addr, 1))[0] & 0xFF;
    var k = key(r); if (!(k in S.orig) && r.kind !== 'burn') S.orig[k] = { slave: r.slave, ob: aw, addr: r.addr, v: old, order: Object.keys(S.orig).length };
    var nv = (old & ~r.mask & 0xFF) | ((r.val << r.lsb) & r.mask);
    await rawWrite(r.slave, aw, r.addr, [nv]);
    log('W 0x' + hex(r.slave, 2) + ':0x' + hex(r.addr, aw === 2 ? 4 : 2) + ' ' + hex(old, 2) + ' -> ' + hex(nv, 2) + ' (mask ' + hex(r.mask, 2) + ')');
    if (r.kind === 'burn') { S.rb[i] = { t: 'sent', cls: 'mid' }; return true; }
    return await doRow(b, i, 'r');
  }
  async function guard(fn) {
    if (!S.linked) { status(tt('nd.needLink'), 'err'); return; }
    if (!icOk()) { status(icWhy(), 'err'); return; }
    if (S.busy) return;
    S.busy = true; status(tt('nd.busy')); render();
    try { await fn(); } catch (e) { status(String(e && e.message || e), 'err'); log('ERR ' + (e && e.message || e)); }
    finally { S.busy = false; render(); }
  }
  function runAll() {
    return guard(async function () {
      var b = cur(), n = 0; S.rb = {};
      var mb = await TconMbus.open(rawWrite); if (!mb.ok) log(tt('tcon.mbusFail', { err: mb.err }));
      for (var i = 0; i < b.rows.length; i++) {
        var ok = await doRow(b, i, 'w'); render();
        if (b.rows[i].kind === 'r' && S.r20d0) { /* 已燒過：照樣讓使用者量頻，但燒錄列一定不送 */ }
        if (!ok) { status(tt('nd.runFail', { i: i + 1 }), 'err'); return; }
        if (b.rows[i].kind !== 'r') n++;
      }
      status(tt('nd.runOk', { n: n }), 'ok');
    });
  }
  function undo() {
    return guard(async function () {
      var list = Object.keys(S.orig).map(function (k) { return S.orig[k]; }).sort(function (a, b) { return b.order - a.order; });
      if (!list.length) { status(tt('nd.undoNone')); return; }
      for (var i = 0; i < list.length; i++) { var o = list[i]; await rawWrite(o.slave, o.ob, o.addr, [o.v]); log('W 0x' + hex(o.slave, 2) + ':0x' + hex(o.addr, o.ob === 2 ? 4 : 2) + ' <- ' + hex(o.v, 2) + ' (restore)'); }
      S.orig = {}; S.rb = {}; status(tt('nd.undoOk', { n: list.length }), 'ok');
    });
  }

  /* ── 事件 ── */
  function onIc() {
    fillItems(); fillGpio(false); S.rb = {};
    if (S.linked && S.checked && S.checked !== $('nd-icsel').value) $('nd-ic').textContent = tt('nd.icGot', { ic: S.checked });
    else if (S.linked && !S.checked && S.manual) $('nd-ic').textContent = tt('nd.icManual', { ic: $('nd-icsel').value });
    render();
  }
  $('nd-icsel').addEventListener('change', onIc);
  $('nd-item').addEventListener('change', function () { fillGpio(false); S.rb = {}; render(); });
  $('nd-q').addEventListener('input', function () { fillItems(); fillGpio(false); S.rb = {}; render(); });
  $('nd-gpios').addEventListener('change', function () { S.rb = {}; render(); });
  $('nd-link').addEventListener('click', connect);
  $('nd-run').addEventListener('click', runAll);
  $('nd-undo').addEventListener('click', undo);
  ['nd-burn', 'nd-burn1', 'nd-burn2'].forEach(function (id) { $(id).addEventListener('change', function () { if (id === 'nd-burn' && !$('nd-burn').checked) { $('nd-burn1').checked = false; $('nd-burn2').checked = false; } S.rb = {}; render(); }); });
  $('nd-tbl').addEventListener('click', function (e) {
    var t0 = e.target.closest('button'); if (!t0) return;
    var i = +(t0.getAttribute('data-w') || t0.getAttribute('data-r')), mode = t0.hasAttribute('data-w') ? 'w' : 'r';
    guard(async function () { await TconMbus.open(rawWrite); var ok = await doRow(cur(), i, mode); render(); if (!ok) status(tt('nd.runFail', { i: i + 1 }), 'err'); else status(''); });
  });
  $('nd-xlsx').addEventListener('click', function () {
    var b = cur(), f = fname(b, 'xlsx');
    download(f, TCONXlsx.build([{ name: 'Sheet1', rows: xlsxRows(b) }]), 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
    status(tt('nd.exported', { f: f }), 'ok'); log('export ' + f);
  });
  $('nd-script').addEventListener('click', function () {
    var b = cur(), f = fname(b, 'script');
    download(f, scriptText(b), 'text/plain');
    status(tt('nd.exported', { f: f }), 'ok'); log('export ' + f);
  });
  window._onLangChange = function () { $('nd-q').placeholder = tt('nd.qPh'); fillItems(); fillGpio(true); render(); };

  $('nd-q').placeholder = tt('nd.qPh');
  fillIc(); fillItems(); fillGpio(false);
  render();
  /* 測試／除錯入口（不在畫面上） */
  window.NBD = { build: build, xlsxRows: xlsxRows, scriptText: scriptText, fname: fname, items: ITEMS, itemsFor: itemsFor, allItems: allItems, defPin: defPin, defPins: defPins, groups: NBD_GROUPS, XLSX_HEADER: XLSX_HEADER, S: S, render: render };
})();
</script>
