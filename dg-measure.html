<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>即時量測 — DG — TCON FAE專用工具箱</title>
<!-- v1.30.0：縮放判準的單一來源。與 pattern.html 用的是同一支，不另寫第二套判準。
     🔴 本頁其餘部分仍是自給自足的單檔（不載 i18n/common），只多這一個相依。 -->
<script src="common/zoomprobe.js?v=20260911dg1320"></script>
<style>
  /* ═══════════════════════════════════════════════════════════════════════
     即時量測分頁（DG 第 2 部分的第二個輸入管道）

     這一頁本身就是量測用的畫面：整個背景就是要量的那一階灰。
     🔴 所以版面只有一條規則 —— 中央那一塊永遠是純灰階。
        資訊與進度一律貼在四個角落，不准跨進中央的安全區。
     ═══════════════════════════════════════════════════════════════════════ */
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden;
    /* 起始就給一階中灰，讓使用者對位時看到的是實際會量到的那種畫面 */
    background: rgb(128, 128, 128);
    font: 14px/1.55 -apple-system, "PingFang TC", "Noto Sans TC", sans-serif;
    color: #fff; -webkit-font-smoothing: antialiased;
  }

  /* ═══ v1.30.0：左上／右上兩個面板隨解析度自適應 ═════════════════════════
     Bruce 2026-09-11：「右上角、左上角要隨螢幕解析度變化，4K 這種高解析度下字
     還是那麼小會看不清楚；解析度越高比例放越大，越低就越小，字體也要跟著改。」

     ── 縮放係數（唯一來源：JS 的 dgmScaleSync() 寫進 --dgm-k）──────────────
         k = clamp(1, min(W / 1920, H / 1080), 2)

     🔴 為什麼是「除以 1920×1080」而不是隨便挑一個係數：
        同一台實體螢幕，解析度加倍 ⇒ 1 個 CSS px 的實體尺寸減半 ⇒ 22px 的字在
        4K 上只有 1080p 上的一半大。字要維持「看起來一樣大」，係數就必須正比於
        解析度 —— 這不是美感取捨，是把物理尺寸還原回去。
        取 min(W/1920, H/1080) 而不是只看高度：超寬或很扁的視窗下，兩個維度誰
        比較緊就由誰決定，面板才不會在矮視窗上長得太高。

     🔴 下限 k ≥ 1（依據：字級）
        本面板最小的字是 12px（.dgm-k 標籤、#dgm-msg、#dgm-prog small）。
        k < 1 會把它壓到 12px 以下 —— Bruce 的硬性限制①「不要讓使用者因為字太小
        而看不到」。12px 是這一頁現行、已經驗收過的最小字級，不再往下。
        副作用（刻意的）：1280×720 與 1920×1080 兩檔 k 都是 1 ⇒ 與改版前**逐 px 相同**，
        這兩個解析度零回歸。

     🔴 上限 k ≤ 2（依據：只到實測過的最高一檔）
        2.0 對應 3840×2160，是本次實測的最高解析度。再往上（5K／8K）沒有實機、
        沒有實測，不外推。
        另外還有一道更硬的上限，不受 k 影響：`.dgm-corner` 的 max-width:30vw 與
        max-height:30vh（右上角 40vh）—— 這是 Bruce 硬性限制②「不要讓視窗因為
        解析度而佔滿整個螢幕」的機械保證，本次一個字都沒動。
        因為 k 與視窗尺寸同比例成長，面板占畫面的**百分比在四種解析度下是同一個數**，
        30vw/30vh 這條線在任何 k 下都不會比今天更接近。

     🔴 中央對準圈與十字（#dgm-ring，240px 七圈＋360px 十字）**刻意不隨 k 縮放**。
        它是拿來對實體探頭口徑的靶，半徑就是實體尺寸本身；跟著螢幕解析度放大，
        探頭就對不上了。這與既有的「水平方向 30vw 保護中央量測區」是同一條規則的
        兩面：面板只准往角落長，靶不動。 */
  :root { --dgm-k: 1; }

  /* 角落面板：max-width 綁在 30vw／30vh，中央 40% × 40% 一定空著 */
  .dgm-corner {
    position: fixed; z-index: 10;
    max-width: 30vw; max-height: 30vh; overflow: hidden;
    background: rgba(0, 0, 0, .72); color: #fff;
    border: 1px solid rgba(255, 255, 255, .22);
    border-radius: calc(10px * var(--dgm-k));
    padding: calc(10px * var(--dgm-k)) calc(13px * var(--dgm-k));
  }
  #dgm-info { top: calc(14px * var(--dgm-k)); left: calc(14px * var(--dgm-k)); }
  /* ─── v1.27.0：右上角面板不再裁掉東西 ───────────────────────────────────
     問題（v1.26.2 實測）：退出全螢幕時，閘門紅框 130px 一回來就把內容撐到
     302 > 194，最下面那一行被 max-height:30vh 的 overflow:hidden 裁掉。
     🔴 不採「把 max-height 調大」：那個上限是這個面板不會長到蓋住量測畫面的
        唯一保證，調大等於把問題換一個地方發作。
     改採兩件事：
     ① **說明性內容搬出面板**。閘門那段「為什麼擋、怎麼辦」是說明，不是狀態，
        已移到底部提示列（#dgm-hint 那一區，沒有高度上限、字更大、置中）。
        面板只留**狀態與控制**：步驟名稱、按鈕、進度、一行訊息。
     ② 面板改 flex 直排，除了 #dgm-msg 之外全部 flex:0 0 auto（不准被壓）。
        #dgm-msg 是唯一長度不可控的一項（錯誤訊息可長可短），讓它成為唯一
        會縮、且縮到底時自己捲動的區塊 —— 空間再不夠也不會有東西被無聲切掉。
     優先序（空間不足時誰先讓）：訊息 ＞ 進度 ＞ 按鈕 ＞ 步驟名稱。
     步驟名稱排第一個位置、按鈕緊接其後，兩者永遠看得到。 */
  #dgm-right {
    top: calc(14px * var(--dgm-k)); right: calc(14px * var(--dgm-k)); text-align: right;
    display: flex; flex-direction: column; align-items: stretch;
    /* ③ 高度上限從 30vh 放寬到 40vh，**只放寬這一個面板**（左上角資訊面板維持 30vh）。
       🔴 這不是「調大了事」，是把上限接回它真正要保護的東西：
          量測點在**畫面正中央**，而這個面板靠右、寬度上限 30vw ⇒ 它的左緣永遠
          在 70vw 之後，**水平方向就已經不可能碰到中央 40% 的量測區**。
          真正由 max-height 保護的只是「不要長成一整條」，40vh 的下緣約在 0.42H，
          仍在畫面垂直中線之上，中央紅圈與探頭位置都不會被蓋到。
          （v1.28.1 起對位圖形的最外緣是十字端點 180px，水平保護條件變成
           `0.5W + 180 < 0.7W` ⇒ **視窗寬 ≥ 900px 仍然碰不到**；量測本來就
           強制全螢幕，這個條件必定成立。更窄的視窗下最外兩圈與十字端點會被
           這塊面板蓋掉一段 —— 依 Bruce 2026-09-10 裁示，被裁成不完整可接受。）
       單靠這一條並不能解決問題（實測：光放寬到 40vh，某些視窗高度仍會不夠），
       所以它是跟上面 ① ② 一起用的，不是替代品。 */
    max-height: 40vh;
  }
  #dgm-right > * { flex: 0 0 auto; }
  /* #dgm-msg 是最後的緩衝：真的擠不下時由它縮並自己捲動。
     🔴 但**不准縮到看不見** —— min-height 綁一行的高度。
        第一版沒有這一條，結果是「面板 scrollHeight ≤ clientHeight」成立、
        但成立的方式是把完成訊息壓成 2px（截圖當場抓到）：
        沒有溢出，只是重要的字被壓沒了，比溢出更難發現。 */
  #dgm-right > #dgm-msg { flex: 0 1 auto; min-height: 1.6em; overflow-y: auto; }

  .dgm-row { display: flex; gap: calc(10px * var(--dgm-k)); justify-content: space-between; white-space: nowrap; }
  .dgm-k { color: #94a3b8; font-size: calc(12px * var(--dgm-k)); }
  .dgm-v { font: 700 calc(14px * var(--dgm-k))/1.55 ui-monospace, Menlo, Consolas, monospace; }
  #dgm-msg { margin-top: calc(8px * var(--dgm-k)); font-size: calc(12px * var(--dgm-k));
             color: #7dd3fc; white-space: pre-wrap;
             max-width: 26vw; text-align: left; }
  #dgm-msg.err { color: #f87171; }
  #dgm-msg.ok  { color: #4ade80; }

  /* ═══ v1.35.0：主按鈕只管「動作」，連線／中斷連線是另一顆 ═══════════════
     Bruce 2026-09-11（第二則）：「既然連線都獨立出來了，那『連線』跟『中斷連線』
     應該一直都是同一顆按鈕，不要混在『開始量測』裡面，這樣才不會混亂。」
     —— v1.34.0 把**同一個狀態的兩面拆到兩顆鈕**（連線在主按鈕、中斷連線在旁邊），
     語意不一致，這一版修掉。職責重新切乾淨，兩顆各管一件事：

       #dgm-link （次要，常駐）  未連線 → 「連線」／已連線 → 「中斷連線」／量測中 → 停用但可見
       #dgm-start（主要，最右）  「開始量測」／「重新量測」／量測中「■ 停止」／未連線 → 停用

     🔴 主按鈕**不再出現「連線」字樣**（四種文字全在 dgmRenderBtns() 裡，可 grep 驗證）。
        未連線時它是關著的，理由由底部紅框那一行說（DGM_LINK_DO，v1.32.0 既有那句）。
     🔴 v1.32.0 那顆 26px 的 ⏻ 鈕已於 v1.34.0 移除，不留死碼 —— 它小到使用者根本
        沒看見，正是當初那個可用性 bug 的成因。連線鈕現在是看得清楚的文字鈕。
     🔴 幾何（padding／font-size／圓角）各態**完全相同**，只換底色：按鈕在游標底下
        變大變小本身就是誤觸來源。停止態的紅色沿用 v1.11.0 #dgm-stop 的 #dc2626，
        沒有新配色。 */
  #dgm-start {
    background: #16a34a; color: #fff; border: 0; border-radius: calc(10px * var(--dgm-k));
    padding: calc(12px * var(--dgm-k)) calc(20px * var(--dgm-k));
    font-size: calc(17px * var(--dgm-k)); font-weight: 700; cursor: pointer;
  }
  #dgm-start:disabled { background: #334155; color: #94a3b8; cursor: not-allowed; }
  /* 量測中：同一顆變成停止（紅色沿用原本那顆獨立停止鈕的 #dc2626） */
  #dgm-start.dgm-stop { background: #dc2626; }
  #dgm-start.dgm-stop:disabled { background: #334155; }
  /* v1.11.0：全螢幕鈕。跟「開始量測」同一列，量測前才用得到
     v1.34.0：連線鈕沿用**同一條規則**（次要動作這一層），不另外配色、
     不另外訂尺寸 —— 兩顆的視覺權重一致，都低於主按鈕（17px／較大 padding）
     但字級 15px 仍然一眼看得到。Bruce 2026-09-11：切回原廠光學 UI 是高頻動作，
     不可以再做成 v1.32.0 那種 26px 的小圖示。
     v1.35.0：id 由 `dgm-unlink` 改為 `dgm-link` —— 它現在管「連線」與「中斷連線」
     兩面，叫 unlink 會與實際功能不符。樣式一個字沒動。 */
  #dgm-fs, #dgm-link {
    background: #0e7490; color: #fff; border: 0; border-radius: calc(10px * var(--dgm-k));
    padding: calc(12px * var(--dgm-k)) calc(16px * var(--dgm-k));
    font-size: calc(15px * var(--dgm-k)); font-weight: 700; cursor: pointer;
    margin-right: calc(8px * var(--dgm-k));
  }
  #dgm-fs:disabled, #dgm-link:disabled { background: #334155; color: #94a3b8; cursor: not-allowed; }
  /* ═══ v1.38.0：「重新選擇儀器」──────────────────────────────────────────
     強制跳出瀏覽器原生的序列埠選擇器。視覺權重刻意再低一級（13px、深底、細框）：
     它是**診斷用的第二條路**，不是日常操作 —— 平常那條（連線鈕）一個字都沒動。
     位置在連線鈕右邊、主按鈕左邊 ⇒ 主按鈕仍然在最右邊那個原本的位置（肌肉記憶）。

     🔴 字數是算出來的，不是隨手取的。`#dgm-right` 是 `max-width: 30vw`，這一列
        四顆鈕的寬度預算（k=1）：全螢幕 85 ＋ 連線 70 ＋ 本鈕 ＋ 開始量測 108。
        視窗寬 1280 時容器內寬 ＝ 1280×0.3 − 13×2 ＝ 358px ⇒ 本鈕只剩 ~95px。
        13px×**四字** ＋ 左右 12px ＋ 框線 ＝ 86px（過），六字要 112px（會擠到
        換行，主按鈕被推到第二列）。所以寫「重選儀器」不寫「重新選擇儀器」。
        ⚠ 這是算出來的，**沒有用像素截圖驗證過**（本次禁用瀏覽器類工具）。 */
  #dgm-pick {
    background: #334155; color: #e2e8f0;
    border: 1px solid rgba(255, 255, 255, .25); border-radius: calc(10px * var(--dgm-k));
    padding: calc(10px * var(--dgm-k)) calc(12px * var(--dgm-k));
    font-size: calc(13px * var(--dgm-k)); font-weight: 700; cursor: pointer;
    margin-right: calc(8px * var(--dgm-k));
  }
  #dgm-pick:disabled { background: #1e293b; color: #64748b; cursor: not-allowed; }
  /* v1.11.0 的獨立停止鈕（#dgm-stop）已於 v1.34.0 併入上面那顆主要動作按鈕。
     🔴 v1.11.0 當時把它獨立出來的理由白紙黑字寫著「如果讓開始鈕就地變成停止鈕，
        連點兩下開始就會直接把自己按停」—— 這個風險是真的，實測也重現得到
        （見 CHANGELOG v1.34.0 的數字）。合併之後由 DGM_STOP_ARM_MS 這個很短的
        忽略窗擋掉，不是把那個風險當作不存在。 */
  /* v1.27.0：這一次量的是 DG 的哪一個步驟。名稱直接沿用 DG 頁那組字串，不另立新名字。
     🔴 22px 是本面板最大的字級（周邊：說明 12px、數值 14px、按鈕 16px），
        Bruce 要的是「一眼看得到現在在哪一步」，不是一行小灰字。
     :empty 時整個不佔位 —— 沒帶名稱進來（例如直接打開這一頁）不留孤兒間距。 */
  /* 標頭：上面是步驟名稱（第 N 部分），下面是這一次量什麼（白灰階亮度／RGB 純色 Pattern）。
     兩行包在同一個容器裡，分隔線畫在容器上 —— 不然「有沒有第二行」會讓線的位置跳來跳去。 */
  #dgm-head {
    margin: 0 0 calc(9px * var(--dgm-k)); padding-bottom: calc(8px * var(--dgm-k));
    border-bottom: 1px solid rgba(255, 255, 255, .18);
    max-width: 26vw; text-align: right;
  }
  #dgm-head.dgm-hidden { display: none; }
  #dgm-step {
    font: 700 calc(22px * var(--dgm-k))/1.3 -apple-system, "PingFang TC", "Noto Sans TC", sans-serif;
    color: #e2e8f0; word-break: break-word;
  }
  /* v1.27.1：量測內容。輔助資訊，比步驟名稱小一級，但仍要一眼看得到（16px vs 周邊 12／14）。 */
  #dgm-what {
    font: 600 calc(16px * var(--dgm-k))/1.35 -apple-system, "PingFang TC", "Noto Sans TC", sans-serif;
    color: #7dd3fc; margin-top: calc(2px * var(--dgm-k)); word-break: break-word;
  }
  #dgm-what:empty { display: none; }
  /* v1.26.2：原本這裡有「關閉這個分頁」鈕（#dgm-close）與量完後的說明框（#dgm-done）。
     兩個都拿掉了 —— 理由見下面 run() 收尾處的註解。量完只留一句話，寫在 #dgm-msg。 */
  #dgm-prog { margin-top: calc(8px * var(--dgm-k));
              font: 700 calc(22px * var(--dgm-k))/1.35 ui-monospace, Menlo, Consolas, monospace; }
  #dgm-prog small { display: block; font-weight: 400; font-size: calc(12px * var(--dgm-k)); color: #94a3b8; }
  /* v1.11.0：沒全螢幕時的閘門說明。紅框，講清楚為什麼擋、怎麼辦。
     v1.27.0：從右上角面板**搬到底部**（就在提示列上方）。它是說明不是狀態，
     而且它 130px 的高度正是把面板撐爆、害最後一行被裁掉的元凶。
     底部這一區沒有高度上限，字也放得下。 */
  /* 底部說明區：閘門紅框在上、操作提示在下，用同一個容器直排，
     免得兩塊各自 position:fixed 在行數變多時互相疊到。 */
  /* v1.30.0：底部這一區也吃 --dgm-k。
     🔴 這一條是我在 Bruce 原話（他只點名「右上角與左上角」）之外多做的一格，
        理由是實測 4K 截圖看到的結果：兩個角落的字放大之後，**整個畫面唯一還看不清楚
        的字就剩下這一塊**，而它偏偏是「下一步該做什麼」與全螢幕警示所在的地方，
        留著不放大會直接違背他訂的硬性限制①（不要讓使用者因為字太小而看不到）。
        已在回報中列明，若他認為不該動，把這幾行的 var(--dgm-k) 拿掉即可還原。 */
  #dgm-bottom {
    position: fixed; left: 50%; bottom: calc(22px * var(--dgm-k));
    transform: translateX(-50%); z-index: 7;
    display: flex; flex-direction: column; align-items: center; gap: calc(8px * var(--dgm-k));
    max-width: 70vw; pointer-events: none;
  }
  #dgm-gate {
    padding: calc(9px * var(--dgm-k)) calc(14px * var(--dgm-k));
    border: 1px solid #dc2626; border-radius: calc(10px * var(--dgm-k));
    background: rgba(0, 0, 0, .78); color: #fecaca;
    font-size: calc(12.5px * var(--dgm-k)); line-height: 1.6;
    text-align: center;
  }
  #dgm-gate.dgm-hidden { display: none; }
  #dgm-gate:empty { display: none; }
  /* v1.27.1：F11 全螢幕下按 ESC 時的提示（見下方 keydown 處理器的實測說明）。
     放底部說明區，全螢幕下也看得見；一句話，不解釋。 */
  #dgm-esc {
    padding: calc(9px * var(--dgm-k)) calc(16px * var(--dgm-k));
    border: 1px solid #f59e0b; border-radius: calc(10px * var(--dgm-k));
    background: rgba(0, 0, 0, .82); color: #fcd34d;
    font: 700 calc(15px * var(--dgm-k))/1.4 -apple-system, "PingFang TC", "Noto Sans TC", sans-serif;
    text-align: center;
  }
  #dgm-esc.dgm-hidden { display: none; }

  /* ═══ v1.30.0：畫面不是 1:1／沒有全螢幕的警示 ══════════════════════════
     判準與呈現形式**沿用 pattern.html v3.7.0／v3.8.1 那一套**，不另立第二套：
       · 判準：common/zoomprobe.js（原本內嵌在 pattern.html，v3.8.2 抽出來共用）
       · 呈現：邊緣橘色呼吸燈 ＋ 可關閉的全畫面提示視窗（樣式照抄，見下方註記）
     🔴 只有**文字**不照抄 —— 依 Bruce 2026-09-11「警告文字越精簡越好，不用解釋，
        只要告訴要怎麼做就好」，本頁的警示文字是重寫的最短版本。

     🔴 只有**一條**呼吸燈、**一個**視窗：兩種狀況（沒全螢幕／不是 100%）同時成立
        時不疊兩層框、不跳兩個視窗，視窗裡多一行字而已。

     🔴 量測進行中一律不顯示（見 JS 的 dgmWarnSync）：視窗會蓋住整個畫面，
        直接毀掉量測；呼吸燈是會變化的橘光，畫面在量測時必須是純灰階。
        這與「量測一開始就把中心紅圈整個拿掉」是同一條規則。 */

  /* (1) 邊緣橘色呼吸燈 —— 樣式照抄 pattern.html 的 #pg-zw-glow（同源，改要一起改）*/
  #dgm-warn-glow {
    position: fixed; inset: 0; z-index: 2147483200;
    display: none; pointer-events: none;
    /* 光暈的粗細也吃 --dgm-k：4K 上 7px 的邊只有 1080p 上的一半粗，會看不見 */
    box-shadow:
      inset 0 0 0 calc(7px * var(--dgm-k)) rgba(249,115,22,.98),
      inset 0 0 calc(34px * var(--dgm-k)) calc(10px * var(--dgm-k)) rgba(249,115,22,.55);
    animation: dgmWarnBreathe 1.6s ease-in-out infinite;
  }
  #dgm-warn-glow.on { display: block; }
  @keyframes dgmWarnBreathe {
    0%, 100% { opacity: .32; }
    50%      { opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    #dgm-warn-glow { animation: none; opacity: .95; }
  }

  /* (2) 提示視窗 —— 🔴 一定可以關掉（誤判時不能把人鎖死），同 pattern */
  #dgm-warn-modal {
    position: fixed; inset: 0; z-index: 2147483100;
    display: none; align-items: center; justify-content: center;
    background: rgba(2,6,23,.90); padding: calc(18px * var(--dgm-k));
  }
  #dgm-warn-modal.on { display: flex; }
  .dgm-warn-box {
    width: min(calc(460px * var(--dgm-k)), 100%);
    background: #1e293b; color: #e2e8f0;
    border: calc(2.5px * var(--dgm-k)) solid #f97316; border-radius: calc(14px * var(--dgm-k));
    padding: calc(20px * var(--dgm-k)) calc(20px * var(--dgm-k)) calc(16px * var(--dgm-k));
    text-align: center;
    box-shadow: 0 0 0 calc(4px * var(--dgm-k)) rgba(249,115,22,.22), 0 18px 50px rgba(0,0,0,.7);
  }
  #dgm-warn-do {
    font-size: calc(20px * var(--dgm-k)); font-weight: 900; color: #fdba74; line-height: 1.45;
  }
  /* 第二行只在「兩種狀況同時成立」時才有內容；:empty 時整行不佔位 */
  #dgm-warn-do2 { font-size: calc(20px * var(--dgm-k)); font-weight: 900; color: #fdba74;
                  line-height: 1.45; margin-top: calc(6px * var(--dgm-k)); }
  #dgm-warn-do2:empty { display: none; }
  #dgm-warn-close {
    margin-top: calc(16px * var(--dgm-k)); width: 100%;
    padding: calc(11px * var(--dgm-k)) calc(12px * var(--dgm-k));
    border-radius: calc(9px * var(--dgm-k)); cursor: pointer;
    background: #f97316; color: #1c0a00; border: none;
    font-size: calc(14px * var(--dgm-k)); font-weight: 800; font-family: inherit;
  }
  #dgm-warn-close:hover { background: #fb923c; }

  /* ── 中心紅圈：讓探頭對準螢幕正中心 ──────────────────────────────────
     🔴 量測一開始就整個拿掉（display:none）。探頭正下方留著紅色圖案
        會直接污染讀值 —— 這不是美觀問題，是量到的數字會錯。 */
  #dgm-ring {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 240px; height: 240px; z-index: 5; pointer-events: none;
  }
  #dgm-ring.dgm-hidden { display: none; }
  #dgm-ring i {
    position: absolute; display: block; background: none;
    border: 2px solid #ff0000; border-radius: 50%;
  }

  /* ── 對位圈：7 個等距同心圓，讓不同口徑的探頭都有圈可以對 ───────────────
     v1.28.0 由原本的 2 個圈補成 7 個；v1.28.1 把線寬統一成 2px 並延長十字。

     半徑的定義用**筆劃中心線**（border 的正中央），不是外緣也不是內緣 ——
     對「把探頭口徑對上某個半徑」來說，一條有厚度的線代表的半徑就是它的
     中心線。七個圈的線寬既然全都是 2px，三種定義只差一個常數 1px，等距與
     否不受影響；中心線仍是唯一有物理意義的那一個。

       中心線半徑 r = (120 − inset) − border-width / 2 = 119 − inset
       ⇒ 🔴 inset = 119 − r   ← 七條規則全部服從這一條，沒有例外

     兩個原始半徑（v1.28.0 之前就存在、使用者已經熟悉的那兩個位置）：
       內 .r2 = 35 ；外 .r1 = 118.5     間距 d = (118.5 − 35) / 4 = 20.875

     | 圈 | 中心線半徑 r | inset = 119 − r |
     |----|-------------|-----------------|
     | .r2 | 35          | 84px            |
     | .r3 | 55.875      | 63.125px        |
     | .r4 | 76.75       | 42.25px         |
     | .r5 | 97.625      | 21.375px        |
     | .r1 | 118.5       | 0.5px           |
     | .r6 | 139.375     | −20.375px       |
     | .r7 | 160.25      | −41.25px        |

     🔴 v1.28.1：`.r1` 原本是 `inset: 0` ＋ 3px，比其餘六圈粗（Bruce 2026-09-10：
        「不要有特別不一樣的地方」）。改成 2px 之後 **inset 必須從 0 改成 0.5px**，
        否則邊框盒仍是 240 寬 ⇒ 中心線會從 118.5 跑到 119，七圈就不再等距。
        border-box 寬 = 240 − 0.5×2 = 239 ⇒ 半寬 119.5 ⇒ 中心線 119.5 − 1 = 118.5。
        線寬統一之後 `.r2` 的 `border-width: 2px` 覆寫也不再需要（基底規則就是
        2px），一併移除 —— 產品裡不留任何「這一圈特別不一樣」的殘留。

     🔴 邊界：.r6 / .r7 的直徑是 280.75px 與 322.5px，會超出 240px 的容器
        （負 inset），視窗夠小的時候還會超出畫面。**刻意照畫不管**，讓瀏覽器
        自然裁掉（Bruce 2026-09-10 裁示）：圈的用途是對準口徑，半徑位置本身
        就是資訊，依視窗大小動態拿掉會讓同一個圈時有時無，使用者反而數不出
        自己看的是第幾圈。#dgm-ring 沒有 overflow 限制、body 是 overflow:hidden，
        所以超出只會被裁切，不會生出捲軸、也不會位移。 */
  #dgm-ring .r1 { inset:   0.5px;   }
  #dgm-ring .r2 { inset:  84px;     }
  #dgm-ring .r3 { inset:  63.125px; }
  #dgm-ring .r4 { inset:  42.25px;  }
  #dgm-ring .r5 { inset:  21.375px; }
  #dgm-ring .r6 { inset: -20.375px; }
  #dgm-ring .r7 { inset: -41.25px;  }

  /* 十字：v1.28.1 從半長 120px 延長到 **180px**（總長 360px）。
     r7 的中心線是 160.25、外緣 161.25，180 明顯超出去 18.75px，最外圈也能
     靠十字對準。中心點、線寬 2px、顏色一律沒動 —— `margin` 永遠是半長的
     負值，所以中心固定在容器正中心，延長只往兩端長。超出畫面同樣照畫不管。 */
  #dgm-ring b, #dgm-ring u {
    position: absolute; background: #ff0000; left: 50%; top: 50%;
  }
  #dgm-ring b { width: 2px; height: 360px; margin-left: -1px; margin-top: -180px; }
  #dgm-ring u { width: 360px; height: 2px; margin-left: -180px; margin-top: -1px; }
  #dgm-ring s {
    position: absolute; left: 50%; top: 50%; width: 10px; height: 10px;
    margin: -5px 0 0 -5px; background: #ff0000; border-radius: 50%;
  }
  #dgm-hint {
    background: rgba(0, 0, 0, .72); border: 1px solid rgba(255, 255, 255, .22);
    border-radius: calc(10px * var(--dgm-k));
    padding: calc(9px * var(--dgm-k)) calc(14px * var(--dgm-k));
    font-size: calc(12.5px * var(--dgm-k)); color: #cbd5e1;
    text-align: center;
  }
  #dgm-hint.dgm-hidden { display: none; }

  /* v1.38.0：寬高各放大一級（30vw/26vh → 38vw/34vh）。理由只有一個 ——
     連線行的字級從 11px 變成 15px，同樣的行數需要更多空間；量測那些 11px 的行
     一個字都沒改。38vw 從左緣算起仍然遠離中央安全區（50vw），沒有侵入量測畫面。 */
  #dgm-log {
    position: fixed; left: 14px; bottom: 14px; z-index: 10;
    max-width: 38vw; max-height: 34vh; overflow: auto;
    background: rgba(0, 0, 0, .72); border: 1px solid rgba(255, 255, 255, .22);
    border-radius: 10px; padding: 8px 11px;
    font: 11px/1.5 ui-monospace, Menlo, Consolas, monospace; color: #94a3b8;
    white-space: pre-wrap; display: none;
  }
  #dgm-log .e { color: #f87171; } #dgm-log .o { color: #4ade80; }
  /* ═══ v1.38.0：連線相關的行放大 ═══════════════════════════════════════
     Bruce 2026-09-11：「把連線相關的字體放大（比其他 log 更大），這樣一眼就能
     看出哪些跟連線異常確認有關。」
     11px → 15px（1.36 倍）＋ 每行固定前綴（▶／★／✔／✕）。差一級字級才叫
     「一眼看到」，差 1～2px 只是「找得到」。量測那些行維持 11px 不動，
     兩者放在同一個視窗裡才會形成對比。 */
  #dgm-log .lk { font-size: 15px; line-height: 1.45; color: #e2e8f0; margin: 3px 0; }
  #dgm-log .lk.e { color: #fca5a5; }   /* 失敗 */
  #dgm-log .lk.o { color: #86efac; }   /* 成功 */
  #dgm-log .lk.i { color: #fcd34d; }   /* 要注意，但不是錯（例如走了哪一條路） */
  /* 「複製 log」：sticky 在第一列，捲到哪都按得到。
     這顆鈕是這一版真正的交付物 —— 沒有它，同事測完現場什麼都帶不回來。 */
  #dgm-log-copy {
    position: sticky; top: 0; z-index: 1; display: block; margin: 0 0 6px auto;
    background: #1e293b; color: #e2e8f0; border: 1px solid rgba(255, 255, 255, .28);
    border-radius: 7px; padding: 4px 10px; cursor: pointer;
    font-family: inherit; font-size: 12px; line-height: 1.3;
  }
  #dgm-log-copy:active { background: #475569; }
</style>
</head>
<body>

<!-- 左上角：解析度、目前灰階值、Frame rate
     v1.30.0：原本最下面那段 62 字的 .dgm-src（解釋兩個更新率為什麼會不一樣）已移除
     —— 那是「為什麼」，兩個欄位的括號註記已經把來源講完了。 -->
<div class="dgm-corner" id="dgm-info">
  <div class="dgm-row"><span class="dgm-k">解析度</span><span class="dgm-v" id="dgm-res">—</span></div>
  <div class="dgm-row"><span class="dgm-k" id="dgm-gray-k">目前灰階值</span><span class="dgm-v" id="dgm-gray">128</span></div>
  <div class="dgm-row"><span class="dgm-k">Frame rate（瀏覽器）</span><span class="dgm-v" id="dgm-fps">—</span></div>
  <div class="dgm-row"><span class="dgm-k">更新率（儀器）</span><span class="dgm-v" id="dgm-mvs">—</span></div>
  <div class="dgm-row"><span class="dgm-k">全螢幕</span><span class="dgm-v" id="dgm-fsstate">—</span></div>
</div>

<!-- 右上角：步驟名稱 ＋ 全螢幕 ＋ 開始量測 ＋ 停止 ＋ 進度 -->
<div class="dgm-corner" id="dgm-right">
  <!-- v1.27.0：這一次量的是 DG 的哪一個步驟。🔴 放**最上面**是刻意的 ——
       .dgm-corner 是 max-height:30vh + overflow:hidden，裁的是**下面**，
       放在第一個位置才不會變成第一個被裁掉的東西。 -->
  <div id="dgm-head" class="dgm-hidden">
    <div id="dgm-step"></div>
    <div id="dgm-what"></div>
  </div>
  <!-- v1.35.0：三顆鈕、三件事，文字與開關全部由 dgmRenderBtns() 決定：
         #dgm-fs    全螢幕 ⇄ 關閉全螢幕（F11 那一種退不掉，見該處說明）
         #dgm-link  連線 ⇄ 中斷連線（常駐可見；量測中停用）
         #dgm-start 開始量測／重新量測／■ 停止（未連線時停用）
       🔴 主按鈕保持在最右邊那個原本的位置不動（肌肉記憶）。
       🔴 HTML 裡的初始值寫的是「一載入必然成立」的那一種（未全螢幕、未連線、
          未量測）；真正的值仍由 dgmRenderBtns() 給，這裡只是不讓它閃一下。 -->
  <div>
    <button id="dgm-fs">全螢幕</button><button id="dgm-link">連線</button><button id="dgm-pick">重選儀器</button><button id="dgm-start" disabled>開始量測</button>
  </div>
  <div id="dgm-prog"></div>
  <div id="dgm-msg">連線 → 初始化 → 零校正（蓋遮光蓋）→ 掃 L0～L255。</div>
</div>

<!-- 中心紅圈：對位用，量測一開始就消失 -->
<div id="dgm-ring"><i class="r1"></i><i class="r2"></i><i class="r3"></i><i class="r4"></i><i class="r5"></i><i class="r6"></i><i class="r7"></i><b></b><u></u><s></s></div>

<!-- v1.27.0：底部說明區。全螢幕閘門的說明（紅框）從右上角面板搬到這裡 ——
     它是「為什麼擋、怎麼辦」的說明，不是狀態；留在面板裡會把面板撐到被裁。 -->
<div id="dgm-bottom">
  <div id="dgm-esc" class="dgm-hidden">按 F11 離開全螢幕</div>
  <div id="dgm-gate" class="dgm-hidden"></div>
  <!-- v1.30.0：只留「要做什麼」的四步，理由全刪（原文 66 字 → 26 字）。 -->
  <!-- v1.32.0：多一步連線 —— 沒連線就按不了「開始量測」，這一行是唯一的操作
       順序說明，缺了那一步使用者會撞在關著的按鈕上。
       v1.34.0：連線改成主按鈕的第一個狀態，所以這一行把它排到最前面，用詞
       與按鈕上的字一致（「連線」），不再提那顆已經不存在的 ⏻。 -->
  <div id="dgm-hint">拖到要量的螢幕 → 按「連線」 → 按「全螢幕」 → 探頭對準紅圈中心 → 按「開始量測」</div>
</div>

<!-- v1.30.0：警示層。呼吸燈一條、視窗一個，兩種狀況共用（見 CSS 那段說明） -->
<div id="dgm-warn-glow" aria-hidden="true"></div>
<div id="dgm-warn-modal" role="alertdialog" aria-modal="true" aria-labelledby="dgm-warn-do">
  <div class="dgm-warn-box">
    <div id="dgm-warn-do">—</div>
    <div id="dgm-warn-do2"></div>
    <button id="dgm-warn-close">知道了</button>
  </div>
</div>

<!-- v1.38.0：log 視窗多一顆「複製 log」。它是第一個子節點，log() 一律 appendChild，
     所以行的順序不受影響（驗證腳本取文字時只取 div，不會把鈕的字算進去）。 -->
<div id="dgm-log"><button id="dgm-log-copy" type="button">複製 log</button></div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };

  /* ═══ 回傳對象 ══════════════════════════════════════════════════════════
     🔴 targetOrigin 不用 '*'。本頁與 dg.html 一定同源（同一個目錄下的兩個檔），
        所以直接用自己的 origin 就是明確指定。file:// 開啟時 location.origin
        會是字串 'null'（不是合法 URL、postMessage 會丟 SyntaxError），
        這種情況退回 '/' —— 它的意思是「限本視窗的來源」，一樣不是萬用字元。 */
  var DGM_TARGET_ORIGIN =
    (location.origin && location.origin !== 'null') ? location.origin : '/';

  /* ═══ 每一階切換之後等多久才量 ══════════════════════════════════════════
     取 500 ms。理由：
       · 面板本身的 Gray-to-Gray 響應在 60 Hz 下不過幾個 frame（< 50 ms），
         真正慢的是 TCON 的 overdrive／FRC 收斂與背光迴路穩定，那是數十到
         上百 ms 等級；
       · 儀器這一端 FSC,3（AUTO）會依亮度自動延長積分時間，暗階時一次積分
         就可能吃掉一百多 ms，取樣窗必須整段落在畫面已經穩定之後；
       · 500 ms 在 60 Hz 下是 30 個 frame，上面兩項都涵蓋得住，
         256 階總共也只多花約 2 分鐘。
     原廠量測軟體同樣有這個等待時間設定；這裡不做成 UI 選項，
     一鍵測試不該讓使用者去猜一個他無從判斷的數字。 */
  var DGM_SETTLE_MS = 500;

  /* ═══ v1.12.0：兩種量測模式 ═══════════════════════════════════════════
     · gray（預設）＝ DG 第 2 部分：白灰階 L0 ～ L255，256 階
     · prim        ＝ DG 第 3 部分：R／G／B 三個純色 pattern，3 步
     由 URL 的 ?mode=prim 決定，**不是 UI 選項** —— 使用者是從 DG 頁哪一顆鈕
     進來的，就已經表達了他要量哪一種，不必再讓他選一次。
     兩種模式共用同一套：全螢幕閘門、停止、已跑時間、初始化序列。
     🔴 純色也走 MDS,0（x, y, Lv）：跟灰階同一組初始化，回應欄位也同一組，
        重用最多、風險最低。DG 第 3 部分本來就收 x／y／Lv 這一組寫法，
        由 dg.html 用它自己的 dgXyYtoXYZ() 換算成 XYZ 存起來 —— 換算的責任
        留在原本就負責換算的那一頁，量測頁只回報它真的量到的東西。 */
  /* ─── v1.26.1：模式不再是「開頁時就定死」───────────────────────────────
     使用者會把這個分頁拖到要量的那台面板上。他在 DG 頁換一個入口再按一次
     「即時量測」時，不該再開一個新分頁 —— 那等於白費他拖曳的功夫。
     所以 DG 頁改成**重用這個分頁**，用 postMessage（'dg-measure-task'）通知
     它換一個量測任務；本頁不重新導航（重新導航 ＝ 重新載入，視窗可能被搬回
     預設位置，跟開新的一樣糟）。
     🔴 因此 DGM_MODE／DGM_STEPS 從「常數」變成「可被換掉的目前任務」。
        換任務的入口只有 dgmSetTask() 一支，且**只在沒有量測在跑的時候**才會
        真的換過去（見 dgmApplyTask）—— 半套資料算到新任務頭上是資料正確性
        問題，不是介面問題。 */
  var DGM_QS = (function () {
    try { return new URLSearchParams(location.search); }
    catch (e) { return { get: function () { return null; } }; }
  })();
  var DGM_MODE = (DGM_QS.get('mode') === 'prim') ? 'prim' : 'gray';
  /* 任務編號：DG 頁每按一次「即時量測」就 +1，回傳結果時原封帶回去。
     用途是讓 DG 頁能認出「這批資料是哪一次按鈕要的」，不會把上一個入口的
     資料算到新的入口頭上（開頁時由 ?task= 帶進來，換任務時由訊息更新）。 */
  var DGM_TASK = (function () {
    var n = parseInt(DGM_QS.get('task'), 10);
    return isNaN(n) ? 0 : n;
  })();
  // 本次載入的身分證（驗證用；重新載入一定會變，換任務不會變）
  var DGM_LOAD_ID = String(Date.now()) + '-' + Math.random().toString(36).slice(2, 8);
  var dgmSwitchCount = 0;

  /* ─── v1.27.0：這一次量的是 DG 的哪一個步驟 ─────────────────────────────
     Bruce 2026-09-09：「量測頁上要顯示這次量測是哪一個步驟的名稱，讓使用者知道
     現在在什麼階段。字要大、要清楚。」
     🔴 名稱**不由本頁決定**：DG 頁那個按鈕迴圈的 p[2] 就是主頁面在用的步驟稱呼
        （第 2 部分／第 3 部分／光學資料比較（新增資料）／第 4 部分（確認結果）），
        原封傳過來。本頁自己造一份名字，遲早會跟主頁面對不上。
     傳法沿用既有的兩條路：開新頁走 ?dest=、重用換任務走 dg-measure-task 的 dest 欄位
     —— 沒有第三條路。 */
  var DGM_DEST = (function () {
    try { return DGM_QS.get('dest') || ''; } catch (e) { return ''; }
  })();
  /* v1.27.1：這一次量的是什麼（白灰階亮度／RGB 純色 Pattern）。
     🔴 跟步驟名稱一樣**由 DG 頁決定用詞**，走同一條路（?what= 與訊息的 what 欄位），
        不是本頁看著 DGM_MODE 自己造字 —— 那兩個詞是 DG 頁第 2／第 3 部分卡片上的
        既有用語，兩邊各寫一份遲早會不一致。 */
  var DGM_WHAT = (function () {
    try { return DGM_QS.get('what') || ''; } catch (e) { return ''; }
  })();
  function dgmRenderStep() {
    // textContent：名稱是訊息／網址帶進來的字串，不進 innerHTML
    $('dgm-step').textContent = DGM_DEST || '';
    $('dgm-what').textContent = DGM_WHAT || '';
    // 兩行都沒有東西時整個標頭不佔位（例如直接打開這一頁），不留孤兒間距與分隔線
    $('dgm-head').classList.toggle('dgm-hidden', !(DGM_DEST || DGM_WHAT));
  }

  // prim 模式的三步：[代號, 顯示名, RGB]
  var DGM_PRIMS = [
    ['r', '純紅 R', [255, 0, 0]],
    ['g', '純綠 G', [0, 255, 0]],
    ['b', '純藍 B', [0, 0, 255]]
  ];

  var DGM_STEPS = (DGM_MODE === 'prim') ? DGM_PRIMS.length : 256;   // 不做成可選

  /* ═══ v1.11.0：進度顯示 ══════════════════════════════════════════════════
     兩個改動，都是 Bruce 2026-09-07 指定的：
     ① 進度用**實際灰階** L0 ～ L255 表示，不再寫「第 n / 256 階」。
     ② 時間改成**已跑多久（正數累計）**，不再估「剩餘約 X 分 Y 秒」。

     🔴 為什麼把剩餘時間整個拿掉而不是把它估準（實測根因，見 CHANGELOG）：
        原本的 `per = 已用時間 / 已完成階數` 是**累積平均**，而每一階的耗時
        並不是定值 —— FSC,3（AUTO）在暗階會自動拉長積分時間，L0 慢、L255 快，
        是一路遞減的。用累積平均去乘剩餘階數，會一開始就高估，然後在整輪裡
        把高估的部分吐回去 ⇒ 顯示的秒數掉得比真實時間快（Bruce：「跳秒跳得太快」）。
        再怎麼平滑，估計值終究是估計值；**已用時間是實測值，不會亂跳也不會騙人**。
     時間源用 performance.now()（單調），不用 Date.now()（會被系統校時往回拉）。 */
  var scanT0 = 0;               // 本次量測的起點（performance.now()）
  var scanTimer = null;         // 每秒重畫一次，讓時間在等待中也是活的
  var progLabel = '準備中';      // 上面那行：準備中 → L0 … L255

  function fmtDur(ms) {
    var s = Math.max(0, Math.floor(ms / 1000));
    var mm = Math.floor(s / 60), ss = s % 60;
    return (mm < 10 ? '0' : '') + mm + ':' + (ss < 10 ? '0' : '') + ss;
  }
  function elapsedMs() { return scanT0 ? (performance.now() - scanT0) : 0; }
  function renderProg() {
    $('dgm-prog').innerHTML = progLabel + '<small>已跑 ' + fmtDur(elapsedMs()) + '</small>';
  }
  function progStart() {
    scanT0 = performance.now(); progLabel = '準備中';
    renderProg();
    if (scanTimer) clearInterval(scanTimer);
    scanTimer = setInterval(renderProg, 1000);
  }
  function progStop() { if (scanTimer) { clearInterval(scanTimer); scanTimer = null; } }

  // ── 畫面 ────────────────────────────────────────────────────────────────
  function setFill(r, g, b, label) {
    document.body.style.background = 'rgb(' + r + ',' + g + ',' + b + ')';
    $('dgm-gray').textContent = label;
  }
  function setGray(g) { setFill(g, g, g, String(g)); }
  function msg(t, cls) { $('dgm-msg').textContent = t; $('dgm-msg').className = cls || ''; }
  function log(t, cls) {
    var el = $('dgm-log'); el.style.display = 'block';
    var d = document.createElement('div'); if (cls) d.className = cls;
    d.textContent = '[' + new Date().toTimeString().slice(0, 8) + '] ' + t;
    el.appendChild(d); el.scrollTop = el.scrollHeight;
  }

  /* ═══════════════════════════════════════════════════════════════════════
     v1.38.0：連線診斷 log
     ───────────────────────────────────────────────────────────────────────
     Bruce 2026-09-11：「多一個專門 debug、測試連線的 log 視窗，或是直接整合在
     原本 log 的視窗裡面，但把連線相關的字體放大（比其他 log 更大），這樣一眼就
     能看出哪些跟連線異常確認有關。」

     🔴 兩個做法取**整合進原本那個視窗**，不另開第二個。理由不是偏好，是這三條：
        ① 要分辨的那幾種狀況，判準全在**先後順序**上（getPorts() 之後才輪到
           requestPort()、open() 過了才輪到第一個位元組、第一個位元組之後才輪到
           第一筆回應）。拆兩個視窗＝兩條時間軸，貼回來之後沒有人接得回去。
        ② 交付物是同事貼回來的那一段文字。一顆「複製 log」只複製得到一個視窗，
           拆兩個就會只帶回一半 —— 而缺的那一半正好是要拿來判斷的。
        ③ 「一眼看得出來」靠的是**字級差**（11px → 15px）與固定前綴，在同一個
           視窗裡就已經成立，不需要第二個視窗來達成。

     🔴 這一整組只做**觀測**：不改任何判斷、參數、訊息，也不新增任何 `await`
        —— 下面每一支都是同步的，所以連線那幾支的時序與 v1.37.0 逐步相同。
     ═══════════════════════════════════════════════════════════════════════ */

  /* 毫秒級時戳。量測那些行用的是 [hh:mm:ss]，這裡要能比對「哪一步花了多久」，
     所以多帶三位毫秒。 */
  function dgmStamp() {
    var d = new Date();
    return d.toTimeString().slice(0, 8) + '.' + ('00' + d.getMilliseconds()).slice(-3);
  }
  function lk(t, cls) {
    var el = $('dgm-log'); el.style.display = 'block';
    var d = document.createElement('div');
    d.className = 'lk' + (cls ? ' ' + cls : '');
    d.textContent = '[' + dgmStamp() + '] ' + t;
    el.appendChild(d); el.scrollTop = el.scrollHeight;
  }

  /* 例外的**原字串**。🔴 這裡一律不解讀、不分類 —— 要給使用者看的那句人話由
     DGM_ERR 決定，兩者互不干涉。log 這一側的價值就在於它沒有被翻譯過。 */
  function dgmErrMsg(e) { return (e && e.message != null) ? String(e.message) : ''; }

  /* VID／PID 十六進位與十進位各印一次（Bruce 指定）。 */
  function dgmHexDec(v) {
    if (v === undefined || v === null) return '—';
    return '0x' + ('0000' + v.toString(16).toUpperCase()).slice(-4) + '（十進位 ' + v + '）';
  }
  function dgmPortInfo(p) {
    if (!p) return '(null)';
    var i;
    try { i = (p.getInfo ? p.getInfo() : null) || {}; }
    catch (e) { return 'getInfo() 丟例外：' + dgmErrMsg(e); }
    var s = 'VID ' + dgmHexDec(i.usbVendorId) + ' · PID ' + dgmHexDec(i.usbProductId);
    /* 其他欄位原樣附上 —— 不同瀏覽器給的欄位不一樣，這裡不預設有哪些。 */
    var rest = [], k;
    for (k in i) if (k !== 'usbVendorId' && k !== 'usbProductId') rest.push(k + '=' + i[k]);
    if (rest.length) s += ' · ' + rest.join(' · ');
    if (i.usbVendorId === undefined && i.usbProductId === undefined && !rest.length) {
      s += ' ⇒ getInfo() 是空的（非 USB 的埠，例如主機板內建 COM）';
    }
    return s;
  }

  /* ═══ user activation ═══════════════════════════════════════════════════
     `requestPort()` 需要 transient user activation。現行呼叫點在
     `await navigator.serial.getPorts()` **之後**，中間還隔著 dgmRenderBtns()
     —— 所以「點下去之後過了多久才真的呼叫」是可疑點之一。
     🔴 本版**只記錄，不改呼叫位置**（改了就不知道同事那台原本是什麼情形）。
     click 的時間點用 capture 階段的監聽器抓，不碰任何既有的處理器。 */
  var dgmLastClickAt = 0, dgmLastClickWhat = '';
  document.addEventListener('click', function (e) {
    dgmLastClickAt = performance.now();
    dgmLastClickWhat = (e.target && (e.target.id || e.target.tagName)) || '?';
  }, true);
  function dgmActivation() {
    var ua = navigator.userActivation;
    if (!ua) return 'userActivation：此瀏覽器沒有這個 API';
    return 'userActivation isActive=' + ua.isActive + ' · hasBeenActive=' + ua.hasBeenActive;
  }
  function dgmSinceClick() {
    return dgmLastClickAt
      ? ('距上一次 click（' + dgmLastClickWhat + '）' + Math.round(performance.now() - dgmLastClickAt) + ' ms')
      : '本頁尚未收到任何 click';
  }

  /* ═══ 複製 log ══════════════════════════════════════════════════════════
     複製的內容**就是畫面上那幾行**（逐行 textContent），不另外加標頭 ——
     貼回來的東西必須與同事螢幕上看到的一模一樣，否則無從對帳。 */
  function dgmLogText() {
    var ds = $('dgm-log').querySelectorAll('div'), out = [], i;
    for (i = 0; i < ds.length; i++) out.push(ds[i].textContent);
    return out.join('\n');
  }
  function dgmCopyFallback(txt) {
    /* http:// 或舊瀏覽器沒有 navigator.clipboard —— 而「連不上」的現場正好很可能
       就是那種環境，所以退路一定要有，不能讓複製鈕在最需要它的時候是死的。 */
    try {
      var ta = document.createElement('textarea');
      ta.value = txt; ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
      document.body.appendChild(ta);
      ta.select(); if (ta.setSelectionRange) ta.setSelectionRange(0, txt.length);
      var ok = !!(document.execCommand && document.execCommand('copy'));
      document.body.removeChild(ta);
      return ok;
    } catch (e) { return false; }
  }
  function dgmCopyDone(ok) {
    var b = $('dgm-log-copy'); if (!b) return;
    b.textContent = ok ? '已複製' : '複製失敗';
    setTimeout(function () { b.textContent = '複製 log'; }, 1500);
  }
  function dgmCopyLog() {
    var txt = dgmLogText();
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(
        function () { dgmCopyDone(true); },
        function () { dgmCopyDone(dgmCopyFallback(txt)); });
    } else dgmCopyDone(dgmCopyFallback(txt));
  }
  $('dgm-log-copy').addEventListener('click', dgmCopyLog);

  /* 開頁就把環境記下來。🔴 一律印**原字串**，不在這裡判斷是哪一種瀏覽器 ——
     分類是看 log 的人的事，機器自作聰明會把真正的線索蓋掉。
     這五行同時也是「兩台電腦對比」的欄位：能連的那台與連不上的那台，
     差異第一眼就看得到。 */
  lk('▶ 連線診斷 log（連線相關的行字比較大）');
  lk('navigator.serial：' + (navigator.serial ? '存在' : '不存在'),
    navigator.serial ? 'o' : 'e');
  lk('isSecureContext：' + window.isSecureContext);
  lk('網址：' + location.href);
  lk('userAgent：' + navigator.userAgent);

  function showRes() {
    $('dgm-res').textContent = screen.width + ' × ' + screen.height
      + (window.devicePixelRatio && window.devicePixelRatio !== 1
        ? ' @' + window.devicePixelRatio + 'x' : '');
  }
  showRes();
  window.addEventListener('resize', showRes);

  // Frame rate：用 requestAnimationFrame 實測，不寫死
  /* v1.35.0：實測值另外留一份**數字**（原本只寫進 DOM 字串）。
     開始量測前的遲滯要用它換算畫面週期 —— 從 textContent 反解字串是自找麻煩。 */
  var dgmFpsHz = 0;
  var fpsN = 0, fpsT = performance.now();
  (function tick(now) {
    fpsN++;
    if (now - fpsT >= 1000) {
      dgmFpsHz = fpsN * 1000 / (now - fpsT);
      $('dgm-fps').textContent = dgmFpsHz.toFixed(1) + ' Hz';
      fpsN = 0; fpsT = now;
    }
    requestAnimationFrame(tick);
  })(performance.now());

  var sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
  // 等畫面真的被畫出去：連續兩個 rAF 才確定上一次的填色已經上到畫面
  function painted() {
    return new Promise(function (r) {
      requestAnimationFrame(function () { requestAnimationFrame(function () { r(); }); });
    });
  }

  /* v1.11.0：可被中止的等待。停止鈕與「離開全螢幕」都要能馬上生效，
     不能讓使用者按了停止還要等這一階的 500 ms 或倒數的 5 秒跑完。
     （已經送出去的 MES,1／ZRC 仍要等儀器回應或逾時 —— 序列埠沒有取消這回事，
     所以停止是「在目前這一步結束後生效」，畫面上會這樣寫。）*/
  var abortWake = null;
  function waitOrAbort(ms) {
    return new Promise(function (r) {
      var t = setTimeout(function () { abortWake = null; r(); }, ms);
      abortWake = function () { clearTimeout(t); abortWake = null; r(); };
    });
  }

  // ── 序列埠 ──────────────────────────────────────────────────────────────
  var port = null, reader = null, keepReading = false, rxBuf = '', pending = null;
  var readLoopRunning = false;   // v1.32.0：readLoop 這支 async 迴圈目前在不在跑（見 readLoop）

  /* ═══ v1.27.0：量測儀連不上的時候，講人話 ═══════════════════════════════
     Bruce 2026-09-09：「要預設各種情況，例如同時開著 CA-S40 原廠軟體在搶同一個
     USB port，這時候要顯示出來提醒使用者注意；或是根本就沒有接 USB，也要有回饋。」

     🔴 判斷依據是**哪一個動作失敗**，不是例外的名字。理由：
        Web Serial 規格裡，requestPort() 在「使用者取消」與「一個可選的裝置都
        沒有」兩種情況下**都是 NotFoundError**，API 分不出來；而 open() 打不開
        （被別的程式佔住、被作業系統鎖住…）規格寫的是 NetworkError，但各家實作
        的字串與邊界不完全一致。把提示綁在「哪一步失敗」上，不管瀏覽器丟什麼名字
        都仍然是對的話；名字只拿來做加值判斷（權限被擋）。
     🔴 原始錯誤字串只寫進左下角的 log，不丟給使用者看。 */
  function dgmErrName(e) {
    return (e && (e.name || '')) + '';
  }
  // v1.30.0：一句話講「要做什麼」，不解釋為什麼。
  var DGM_ERR = {
    unsupported: '請改用 Chrome 或 Edge。',
    // 取消與「一台都沒有」在 API 上同一種錯誤，所以這句話兩種情況都要成立
    noPort:      '沒選到量測儀 —— 接上 USB 再按一次。',
    denied:      '在網址列權限裡允許序列埠，再按一次。',
    busy:        '量測儀被佔用 —— 關掉 CA-S40 再按一次。',
    lost:        '量測儀斷線 —— 接回 USB 後按「重新量測」。'
  };

  /* ═══ v1.38.0：失敗那一行後面附的「可能是什麼」═══════════════════════════
     🔴 這是**給看 log 的人**的提示，不是產品的判斷，也不會影響任何控制流：
        只是把同一個 e.name 在規格上對應得到的幾種可能列出來，讓現場的人知道
        下一步要問什麼。原始的 name／message 一定在同一行的前半段，
        看的人可以完全不理會這後半段。 */
  function dgmWhyRequestPort(nm) {
    if (nm === 'SecurityError') return ' ⇒ 權限被擋（瀏覽器政策／企業政策／非安全來源）';
    if (nm === 'NotFoundError') return ' ⇒ 「使用者按取消」與「清單裡一台可選的都沒有」在 API 上是同一種錯，分不出來 —— 請問現場：選擇視窗裡有沒有東西？';
    if (nm === 'NotAllowedError') return ' ⇒ 沒有 user activation（不是由使用者的點擊直接觸發），或被權限政策擋掉';
    if (nm === 'InvalidStateError') return ' ⇒ 文件狀態不允許（例如視窗不是作用中）';
    return '';
  }
  function dgmWhyOpen(nm) {
    if (nm === 'SecurityError') return ' ⇒ 權限被擋';
    if (nm === 'NetworkError') return ' ⇒ 埠開不起來：被別的程式佔著、或驅動／裝置已經不在了';
    return ' ⇒ 埠開不起來，原始 name 如上';
  }

  /* v1.38.0：使用者用「重選儀器」挑過的那一個。只拿來在 log 裡對照
     「一般路徑最後用的是不是同一個」，**不參與任何判斷**。 */
  var dgmPickedPort = null;

  /* ═══ v1.32.0：儀器連線狀態 ═════════════════════════════════════════════
     本頁只支援 **CA-410**（Web Serial）—— 這是唯一有實機、有協議、Bruce 已用真機
     驗過的那一台。其他機型見 CHANGELOG v1.32.0 的說明。 */
  var dgmLinkActive = false;              // 本工具目前是否握有儀器連線

  function dgmHexOf(s) {
    var b = new TextEncoder().encode(s), out = [], i;
    for (i = 0; i < b.length; i++) out.push(('0' + b[i].toString(16)).slice(-2).toUpperCase());
    return out.join(' ');

  async function cmd(text, waitMs) {
    if (!port || !port.writable) return null;

    if (!dgmFirstMesAt && text === 'MES,1') dgmFirstMesAt = performance.now();
    var wait = new Promise(function (res) {
      pending = { resolve: res, timer: setTimeout(function () { pending = null; res(null); }, waitMs || 5000) };
    });

      var w = port.writable.getWriter();
      // 🔴 結尾只能是 CR（0x0D）。多送一個 LF 會回 ER10。
      await w.write(new TextEncoder().encode(text + '\r'));
      w.releaseLock();

      if (isFirstTx) lk('✔ 送出第一個位元組：' + dgmHexOf(text + '\r') + '　＝「' + text + '」＋CR', 'o');
    } catch (e) {
      // v1.38.0 觀測：寫入失敗的原始 name／message（既有那行只印 message）

      // v1.27.0：寫不進去 ＝ 連線沒了。原始字串進 log，使用者看到的是那一句人話。
      log('送出失敗 ' + text + '：' + e.message, 'e');
      pending = null;
      dgmLost('寫入失敗 ' + text);
      return null;

    // v1.38.0 觀測：第一筆回應，或它逾時了（Bruce 指定要記）
    if (isFirstTx) {
      lk(r === null
        ? ('✕ 第一筆回應：逾時（等了 ' + (waitMs || 5000) + ' ms 沒有任何以 CR 結尾的資料）')
        : ('✔ 第一筆回應：' + r), r === null ? 'e' : 'o');
    }

  async function readLoop() {
    /* v1.32.0：readLoop 到底還在不在跑，要有一個**直接**的答案。
       🔴 原本用 `!keepReading` 當「要不要起一個新的 readLoop」的判準，那是間接的：
          埠被拔掉時，這支迴圈的條件 `port.readable` 變成 null 而自己結束，
          但 keepReading 仍然是 true（只有 closePort() 會把它設回 false）
          ⇒ 下一次連線時判準說「還在跑」，於是不重起 —— 實際上沒有任何 reader，
          之後每一道指令都會逾時。（v1.32.0 的連線鈕讓這條路變得容易走到：
          實測 probe1 的 N6c，斷線後重新連上時 readers 沒有增加。）
       用 readLoopRunning 之後，正常流程的判斷結果與從前**完全一樣**
       （跑著就不重起、closePort 之後就重起），只有上面那個壞掉的情況會不同。 */
    readLoopRunning = true;
    try {
      while (port.readable && keepReading) {
        reader = port.readable.getReader();
        try {
          while (true) {
            var rd = await reader.read();
            if (rd.done) break;
            if (!rd.value || !rd.value.length) continue;
            rxBuf += new TextDecoder().decode(rd.value);
            var i;
            while ((i = rxBuf.indexOf('\r')) >= 0) {
              var line = rxBuf.slice(0, i); rxBuf = rxBuf.slice(i + 1);
              if (pending) { var p = pending; pending = null; clearTimeout(p.timer); p.resolve(line); }
            }
          }
        } finally { reader.releaseLock(); }
      }
    } catch (e) {
      if (keepReading) { log('讀取中斷：' + e.message, 'e'); dgmLost('讀取中斷'); }
    } finally {
      readLoopRunning = false;
    }
  }

  var INIT = [
    ['COM,1', '建立通訊'],
    ['SCS,3', '同步 UNIVERSAL'],
    ['FSC,3', '量測速度 AUTO'],
    ['OPR,1', '選探頭 P1'],
    ['MMS,0', '色彩＋閃爍'],
    ['FMS,0', 'FMA 法'],
    ['MDS,0', 'x, y, Lv 模式'],
    ['MCH,0', '校正通道 0'],
    ['LUS,1', '單位 cd/m²']

  async function closePort() {
    try { await cmd('COM,0', 3000); } catch (e) {}

    try { if (reader) await reader.cancel(); } catch (e) {}
    try { await port.close(); } catch (e) {}

  /* ═══ v1.11.0：全螢幕閘門 ════════════════════════════════════════════════

        ① 按鈕 disabled —— 給人看的
        ② start 處理器一進來就再判一次 —— 給程式看的。

  /* ─── v1.27.0：F11（瀏覽器層級全螢幕）也要算 ─────────────────────────────
     Bruce 2026-09-09：「使用者自己按全螢幕快捷鍵（例如 F11）時，網頁也要偵測得到。」

     🔴 實測（Chrome 153 / macOS，一般分頁，`_tmp_dg1270/probe7_fsprobe.py`）：

     | 狀態 | fullscreenElement | fullscreenchange | display-mode: fullscreen | innerH/outerH |
     |---|---|---|---|---|
     | 一般視窗 | false | — | false | 773 / 860 |
     | **瀏覽器層級全螢幕（F11）** | **false** | **完全不觸發** | **true**（且有 change 事件） | 812 / 812 |
     | Fullscreen API 全螢幕 | true | 觸發 | true | 900 / 900 |
     | 視窗最大化（不是全螢幕） | false | — | **false** | 783 / 870 |

     ① **只監聽 `fullscreenchange` 對 F11 完全無效** —— 那一欄實測是 0 次。
     ② `matchMedia('(display-mode: fullscreen)')` **兩種全螢幕都為 true、都會發
        change 事件，而且最大化時正確地為 false** ⇒ 這是唯一一條兩種都涵蓋的路。

        那一段不算進來），`outerHeight === screen.height` 直接不成立；而**最大化**
        時 `outerHeight（870）=== screen.availHeight（870）`，用尺寸反而會把「最大化」
        誤判成全螢幕。外接螢幕、縮放、多螢幕不同解析度只會讓它更糟。

        沒有第二個地方各判各的。

        F11 偵測不到（會保守地判成「不是全螢幕」＝擋住量測，不會放行髒資料）。 */

    $('dgm-fsstate').textContent = fs ? '是' : '否';
    $('dgm-fsstate').style.color = fs ? '#4ade80' : '#f87171';
    /* v1.35.0：三顆鈕（含全螢幕鈕的文字與開關）與圓圈全部收斂到 dgmRenderBtns()。
       原本這裡手寫 `$('dgm-fs').disabled = fs;` 兩行，是「一項一項手動拉」的寫法。 */
    dgmRenderBtns();
    /* 全部是本檔內的常數字串（DGM_FS_DO／DGM_LINK_DO），沒有外來輸入，所以這裡用
       innerHTML 接 <br> 是安全的；要接外來字串一律走 textContent。 */
    var shown = dgmGateLines();
    $('dgm-gate').innerHTML = shown.join('<br>');
    $('dgm-gate').classList.toggle('dgm-hidden', shown.length === 0);
    /* 量測中掉出全螢幕 ＝ 畫面幾何變了，探頭對到的不再是原本那一點，本次作廢。
       v1.27.0：這一條現在對 **F11 退出**也成立 —— 因為 isFs() 認得 display-mode，
       而下面三種事件裡的 mq change／resize 會在 F11 進出時把這一支叫起來。 */
    if (running && !fs) abort('量測中離開了全螢幕');
    /* v1.30.0：🔴 全螢幕的判定點仍然只有 isFs() 這一支。警示層不自己判一次，
       由這裡把結果推過去 —— 「未全螢幕就擋住開始量測」與「未全螢幕就亮呼吸燈」
       是同一個狀態，不能有兩個來源。 */
    dgmWarnSync();
  }
  /* v1.27.0：三條觸發路徑，缺一不可，但全部只呼叫同一支 syncFs()：
     ① fullscreenchange（＋各家前綴）—— Fullscreen API 那一條
     ② display-mode 媒體查詢的 change —— **F11 唯一會發的通知**
     ③ resize —— 保底。實測 F11 進出各會發 4 次 resize；萬一某個瀏覽器不支援 ②，
        還有這一條能把狀態拉回來，不必等使用者去按才發現。 */
  ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange']
    .forEach(function (ev) { document.addEventListener(ev, syncFs); });
  if (DGM_MQ_FS) {
    if (DGM_MQ_FS.addEventListener) DGM_MQ_FS.addEventListener('change', syncFs);
    else if (DGM_MQ_FS.addListener) DGM_MQ_FS.addListener(syncFs);   // 舊版 Safari
  }
  window.addEventListener('resize', syncFs);

  /* ═══════════════════════════════════════════════════════════════════════
     v1.32.0：連線層
     ───────────────────────────────────────────────────────────────────────
     對外只有 dgmLinkOn()／dgmLinkOff() 兩個入口，狀態只有 dgmLinkActive 一個
     布林 —— 兩顆鈕、閘門都讀同一個值。

     🔴 v1.34.0：入口換了但**能力一件都沒少** —— 連線從 ⏻ 換到主按鈕的第一態，
        主動斷線從 ⏻ 換到常駐的「中斷連線」鈕（而且從 26px 的圖示變成看得清楚的
        文字鈕）。掉線的收尾仍走 `dgmLost()` → `dgmSetLink(false)`，一個字沒動。

     🔴 **擴充點**：真正碰硬體的兩支動作被收在 DGM_LINK 這個物件裡
        （`name` / `on()` / `off()`）。將來若要支援別台儀器（走別的匯流排），
        做法是**多一個同介面的物件並換掉 dgmLink**，不是在這裡長出 if/else 分支。
        本版只有 CA-410 一個實作，也只有它被指到 —— 不留任何沒人呼叫的分支。
     ═══════════════════════════════════════════════════════════════════════ */

  /* v1.34.0：原本這裡有一支 dgmRenderLink()（⏻ 那顆燈的 on／busy／aria-pressed）。
     那顆鈕已移除，狀態改由主按鈕的文字呈現 ⇒ 整支刪掉，不留死碼。 */
  function dgmSetLink(v) {
    dgmLinkActive = !!v;
    syncFs();          // 🔴 按鈕與閘門是同一個狀態的兩個面，只從這裡一起更新
  }

  // ── CA-410：序列埠 ──────────────────────────────────────────────────────
  /* 🔴 這一支是把 v1.31.0 的 run() 步驟 1（取埠 → 開埠 → 起 readLoop）**原封搬出來**
     的，一個判斷、一個參數、一句訊息都沒改。搬出來的理由只有一個：連線這件事現在
     由 ⏻ 那顆鈕負責，run() 不該是唯一入口。
     run() 仍然呼叫同一支（見下方 run() 步驟 1）—— 所以「上一輪跑完 closePort() 把埠
     關掉、使用者再按重新量測」這條路，走的還是與從前一模一樣的程式碼。 */
  async function dgmSerialOn() {
    /* ═══ v1.38.0：以下每一個 lk() 都是**同步**的，沒有新增任何 await ⇒ 判斷、
       參數、訊息、await 的順序與 v1.37.0 逐字相同，只是多印了幾行字。 ═══ */
    var _t = performance.now();
    var ms = function () {
      var n = performance.now(), d = n - _t; _t = n; return ' · ' + Math.round(d) + ' ms';
    };
    lk('▶ 連線（一般路徑）· ' + dgmSinceClick());
    if (!navigator.serial) {
      lk('✕ navigator.serial 不存在 ⇒ 這個瀏覽器（或這個網址）沒有 Web Serial' + ms(), 'e');
      msg(DGM_ERR.unsupported, 'err'); return false;
    }
    var ports = [];
    try { ports = await navigator.serial.getPorts(); }
    catch (e) {
      lk('✕ getPorts() 丟例外 · name=' + dgmErrName(e) + ' · message=' + dgmErrMsg(e) + ms(), 'e');
      log('getPorts 失敗：' + dgmErrName(e) + ' ' + (e && e.message), 'e');
      msg(DGM_ERR.noPort, 'err'); return false;
    }
    lk('getPorts() 回 ' + ports.length + ' 個（＝這個網址先前已授權過的埠）' + ms());
    for (var pi = 0; pi < ports.length; pi++) lk('　　[' + pi + '] ' + dgmPortInfo(ports[pi]));
    if (ports.length) {
      port = ports[0];
      /* 🔴 v1.38.0 觀測（Dispatch 2026-09-11 要查證的那一點）：`getPorts()` 給的是
         「這個來源先前已被授權過的**所有**埠」，不是「量測儀那一個」。清單非空就
         直接用 [0]、而且**不會跳出選擇視窗** —— 若這台電腦以前授權過別的
         USB-Serial 裝置，選中的可能根本不是量測儀。
         本版只把事實印出來（走了哪條路、選中誰），**不改這條路** ——
         要不要改，等拿到現場 log 再由 Bruce 決定。要自己挑，走「重選儀器」。 */
      lk('★ 走「既有授權」這條路：直接用 [0]，不跳選擇視窗 ⇒ ' + dgmPortInfo(port), 'i');
      if (dgmPickedPort && port !== dgmPickedPort) {
        lk('★ 注意：你剛才用「重選儀器」挑的不是這一個，這一輪用的是 [0]', 'i');
      }
    }
    else {
      msg('請選量測儀的序列埠。');
      /* v1.38.0 觀測：requestPort() 需要 transient user activation，而這個呼叫點
         在 await getPorts() 之後。呼叫前把 activation 狀態與「離 click 幾毫秒」
         記下來 —— 這一版只記錄，呼叫位置一個字都沒動。 */
      lk('沒有既有授權 ⇒ 呼叫 requestPort()（瀏覽器會跳出選擇視窗）');
      lk('　　' + dgmActivation() + ' · ' + dgmSinceClick());
      try { port = await navigator.serial.requestPort(); }
      catch (e) {
        /* 🔴 使用者按取消、與「一台可選的裝置都沒有」，規格上**都是 NotFoundError**，
           分不出來 —— 所以這句話寫成兩種情況都成立的樣子，不猜是哪一種。
           SecurityError 是另一回事（權限被政策擋掉），那個分得出來。 */
        lk('✕ requestPort() 失敗 · name=' + dgmErrName(e) + ' · message=' + dgmErrMsg(e) + ms()
          + dgmWhyRequestPort(dgmErrName(e)), 'e');
        log('requestPort 失敗：' + dgmErrName(e) + ' ' + (e && e.message), 'e');
        msg(dgmErrName(e) === 'SecurityError' ? DGM_ERR.denied : DGM_ERR.noPort, 'err');
        return false;
      }
      lk('★ 在選擇視窗裡選了：' + dgmPortInfo(port) + ms(), 'i');
    }
    try {
      lk('open() 參數：baudRate 38400 · dataBits 8 · stopBits 1 · parity none'
        + '（呼叫前 port.readable ＝ ' + (port.readable ? '有（已經開著）' : 'null（還沒開）') + '）');
      if (!port.readable) await port.open({ baudRate: 38400, dataBits: 8, stopBits: 1, parity: 'none' });
    } catch (e) {
      /* 「已經開著」不是錯誤（停止之後再按一次就會走到這裡），其餘一律是打不開。
         打不開最常見的原因就是 Bruce 點名的那個：CA-S40 原廠軟體還開著佔住埠
         —— 序列埠同一時間只能被一個程式開啟。 */
      var nm = dgmErrName(e);
      if (nm !== 'InvalidStateError' && !/already open/i.test((e && e.message) || '')) {
        lk('✕ open() 失敗 · name=' + nm + ' · message=' + dgmErrMsg(e) + ms()
          + dgmWhyOpen(nm), 'e');
        log('open 失敗：' + nm + ' ' + (e && e.message), 'e');
        msg(nm === 'SecurityError' ? DGM_ERR.denied : DGM_ERR.busy, 'err');
        return false;
      }
      // v1.38.0 觀測：這條路原本就是「不算失敗、繼續往下走」，只是從來沒有留下痕跡
      lk('open() 回 ' + nm + ' ⇒ 視為「已經開著」，繼續' + ms(), 'o');
    }
    /* v1.11.0：停止時**不關埠**，所以再按一次時埠往往還開著、readLoop 也還在跑。
       這裡要防的是重複起第二個 readLoop（兩個 reader 搶同一個 stream）。
       v1.32.0：判準從 `!keepReading` 換成 `!readLoopRunning`（理由見 readLoop 那段）。 */
    rxBuf = '';
    if (!readLoopRunning) { keepReading = true; readLoop(); log('埠已開啟 38400', 'o'); }
    else log('沿用上一次已經開著的埠', 'o');
    lk('✔ 埠可用（38400 8N1）· readLoop ' + (readLoopRunning ? '執行中' : '沒有在跑')
      + ' · 最後用的是 ' + dgmPortInfo(port) + ms(), 'o');
    return true;
  }

  /* CA-410 釋放：走既有的 closePort()（COM,0 → 取消 reader → close），
     不另寫一套關法 —— 那支就是本頁量完之後在用的收尾程序。
     🔴 v1.34.0：這一支就是「中斷連線」那顆鈕真正做的事。**真的把埠關掉**
        （close ＋ 停掉 read loop），原廠光學 UI 才接得回去 —— 這正是 Bruce
        要這顆鈕的目的，不能只把旗標設成 false 了事。 */
  async function dgmSerialOff() {
    lk('▶ 中斷連線 ⇒ closePort()（COM,0 → 取消 reader → close）· port ' + (port ? '有' : 'null'));
    if (port) await closePort();
    lk('✔ closePort() 回來了 · readLoop ' + (readLoopRunning ? '仍在跑' : '已停'), 'o');
  }

  /* ═══════════════════════════════════════════════════════════════════════
     v1.38.0：「重新選擇儀器」—— 強制走 requestPort()
     ───────────────────────────────────────────────────────────────────────
     Bruce 2026-09-11：現行 `dgmSerialOn()` 是「getPorts() 不是空的就直接用
     ports[0]」，使用者**永遠沒有機會自己選**。這裡多一條路讓他選得到。

     🔴 這是**新增的第二條路，不是改寫第一條**。上面那一支（getPorts 有就用 [0]）
        一個字都沒動 —— 根因還不知道，不能在這一版就改掉 Bruce 電腦上已經能動的
        那條路。兩條路並存，log 會寫清楚這一次走的是哪一條。

     🔴 `requestPort()` 放在**第一個 await**：transient user activation 是有時效的，
        任何在它前面的 await（例如先去 closePort()）都會多吃掉時間。這條路是新的，
        沒有「維持原樣」的包袱，所以一開始就把它排在最前面。
        釋放舊埠排在**選完之後**才做。

     ⚠ 已知限制（如實寫，不假裝解決了）：選完之後如果按「開始量測」，`run()` 仍然
        會呼叫 `dgmSerialOn()`，那一支仍然是「getPorts() 非空就用 [0]」。若這台電腦
        授權過多個埠、而你挑的不是 [0]，量測那一輪用的會是 [0] —— log 會印出
        「你剛才挑的不是這一個」。**這一版刻意不動那條路**（邊界：不改連線邏輯）。
     ═══════════════════════════════════════════════════════════════════════ */
  async function dgmSerialPick() {
    var _t = performance.now();
    var ms = function () {
      var n = performance.now(), d = n - _t; _t = n; return ' · ' + Math.round(d) + ' ms';
    };
    lk('▶ 重選儀器（強制 requestPort）· ' + dgmSinceClick());
    if (!navigator.serial) {
      lk('✕ navigator.serial 不存在 ⇒ 這個瀏覽器（或這個網址）沒有 Web Serial', 'e');
      msg(DGM_ERR.unsupported, 'err'); return false;
    }
    lk('　　' + dgmActivation() + ' · ' + dgmSinceClick());
    var picked = null;
    try { picked = await navigator.serial.requestPort(); }
    catch (e) {
      lk('✕ requestPort() 失敗 · name=' + dgmErrName(e) + ' · message=' + dgmErrMsg(e) + ms()
        + dgmWhyRequestPort(dgmErrName(e)), 'e');
      msg(dgmErrName(e) === 'SecurityError' ? DGM_ERR.denied : DGM_ERR.noPort, 'err');
      return false;
    }
    dgmPickedPort = picked;
    lk('★ 選到：' + dgmPortInfo(picked) + ms(), 'i');
    /* 舊埠要先放掉，否則兩個埠各有一個 readLoop。走的是既有的 closePort()。 */
    if (port && port !== picked) {
      lk('先釋放上一個埠（closePort）');
      try { await closePort(); } catch (e) { lk('釋放時出錯：' + dgmErrMsg(e), 'e'); }
      lk('　　釋放完成' + ms());
    }
    port = picked;
    /* 🔴 參數與上面那一支**刻意寫成同一組值**（38400 8N1）。不抽成共用常數的原因：
       抽出去就得改動 dgmSerialOn() 那一行，而這一版的邊界是那一支一個字都不動。
       兩處是否一致，由驗證腳本逐字比對（不是靠人記得）。 */
    try {
      lk('open() 參數：baudRate 38400 · dataBits 8 · stopBits 1 · parity none'
        + '（呼叫前 port.readable ＝ ' + (port.readable ? '有（已經開著）' : 'null（還沒開）') + '）');
      if (!port.readable) await port.open({ baudRate: 38400, dataBits: 8, stopBits: 1, parity: 'none' });
    } catch (e) {
      var nm = dgmErrName(e);
      if (nm !== 'InvalidStateError' && !/already open/i.test((e && e.message) || '')) {
        lk('✕ open() 失敗 · name=' + nm + ' · message=' + dgmErrMsg(e) + ms() + dgmWhyOpen(nm), 'e');
        msg(nm === 'SecurityError' ? DGM_ERR.denied : DGM_ERR.busy, 'err');
        return false;
      }
      lk('open() 回 ' + nm + ' ⇒ 視為「已經開著」，繼續' + ms(), 'o');
    }
    rxBuf = '';
    if (!readLoopRunning) { keepReading = true; readLoop(); }
    lk('✔ 埠可用（38400 8N1）· readLoop ' + (readLoopRunning ? '執行中' : '沒有在跑')
      + ' · 這一次用的是 ' + dgmPortInfo(port) + ms(), 'o');
    return true;
  }

  /* 目前唯一的連線實作。換別台儀器時整包換掉這個物件，不在呼叫端長分支。 */
  var DGM_LINK_CA410 = { name: 'CA-410', on: dgmSerialOn, off: dgmSerialOff };
  var dgmLink = DGM_LINK_CA410;

  async function dgmLinkOn() {
    if (dgmLinkBusy || dgmLinkActive) return;
    dgmLinkBusy = true; dgmRenderBtns();   // v1.35.0：忙碌狀態顯示在連線鈕上（「連線中…」）
    var ok = false;
    try { ok = await dgmLink.on(); }
    catch (e) { log('連線例外：' + (e && e.message), 'e'); ok = false; }
    dgmLinkBusy = false;
    dgmSetLink(ok);                        // 🔴 失敗絕不假亮綠（照抄 wfg 那一條）
    /* 連上了就把訊息列收回預設那一句（清掉上一次失敗留下的紅字）。
       🔴 這裡**刻意不寫「已連線」那種狀態句**：狀態的唯一出口是主按鈕與閘門，
          訊息列再寫一次，等於同一個狀態有兩個來源 —— 實測就抓到過：按 OFF 之後
          燈滅了、閘門擋回來了，訊息列卻還停在綠色的「已連線…」（見截圖
          `_tmp_dg1320/shots/shot_5_both_gates.png` 的第一版）。 */
    if (ok) dgmMsgDefault();
  }

  /* v1.34.0：主動中斷連線。v1.32.0 的 dgmLinkOff() 原封回來，
     只把 dgmRenderLink() 換成這一版的 dgmRenderBtns()（那顆燈已經不存在）。
     🔴 量測中不走這裡：閘門在按鈕的 disabled 與下面的處理器裡各擋一次。 */
  async function dgmLinkOff() {
    if (dgmLinkBusy) return;
    dgmLinkBusy = true; dgmRenderBtns();
    try { await dgmLink.off(); }
    catch (e) { log('釋放時出錯：' + (e && e.message), 'e'); }
    dgmLinkBusy = false;
    dgmSetLink(false);
    msg('已中斷連線，序列埠已釋放。');
  }

  /* ═══ v1.35.0：連線鈕的點擊分派（同一顆鈕的兩面）═════════════════════════
     🔴 第二層閘門（給程式看的）：量測中／忙碌中一律不動作，繞過 disabled 也一樣。
     量測中不自動「先停止再斷線」是刻意的 —— 量到一半切斷會留下半套資料，
     而「放棄這一輪」已經在主按鈕上（■ 停止）。要斷線就先按停止。
     🔴 這顆鈕**不套** DGM_STOP_ARM_MS 那個忽略窗：那一個是為了防「連點兩下開始
        把自己按停」，這顆鈕的兩面都不會造成不可逆的損失（連上再斷、斷了再連）。 */
  $('dgm-link').addEventListener('click', function () {
    if (running || dgmLinkBusy) return;
    if (dgmLinkActive) dgmLinkOff(); else dgmLinkOn();
  });

  /* ═══ v1.38.0：「重新選擇儀器」的點擊分派 ═══════════════════════════════
     結構照抄 dgmLinkOn()（busy 旗標 → 做事 → dgmSetLink(結果)），只把中間那一支
     換成 dgmSerialPick()。🔴 失敗一樣絕不假亮綠。
     🔴 第二層閘門同上：量測中／忙碌中一律不動作，繞過 disabled 也一樣。 */
  async function dgmLinkPick() {
    if (dgmLinkBusy || running) return;
    dgmLinkBusy = true; dgmRenderBtns();
    var ok = false;
    try { ok = await dgmSerialPick(); }
    catch (e) { lk('✕ 重新選擇時丟例外：' + dgmErrMsg(e), 'e'); ok = false; }
    dgmLinkBusy = false;
    dgmSetLink(ok);
    if (ok) dgmMsgDefault();
  }
  $('dgm-pick').addEventListener('click', function () {
    if (running || dgmLinkBusy) return;
    dgmLinkPick();
  });

  /* ═══ v1.30.0：兩個面板隨解析度自適應 ═══════════════════════════════════
     曲線與上下限的依據寫在最上面那段 CSS 註解裡（--dgm-k）。這裡只負責算出來。
     🔴 用 viewport（innerWidth/innerHeight）不用 screen.width：量測時本來就強制
        全螢幕，兩者一致；而沒全螢幕時使用者看到的是視窗，面板該配合的是視窗。 */
  var DGM_K_MIN = 1, DGM_K_MAX = 2;
  var DGM_K_REF_W = 1920, DGM_K_REF_H = 1080;
  function dgmScale() {

     🔴 遲滯長度**不是拍腦袋的數字**，由兩項相加，兩項各自有來源：

       ① N 個畫面週期，N = DGM_RING_FRAMES = 2，週期取自**實測**的更新率：

  var DGM_GTG_MS = 50;
  var DGM_HZ_MIN = 24, DGM_HZ_MAX = 480;
  var dgmMvsHz = 0;                      // 儀器回報的畫面更新率（run() 的步驟 2.5 寫入）
  var dgmRingGoneAt = 0;                 // 圓圈確定已經不在畫面上的時刻（驗證用）
  /* 🔴 這一輪**實際**等了多久、用的是哪一個更新率，當場記下來。

    /* 停止後可以直接再按一次；掉出全螢幕就仍然關著；連線掉了就變回「連線」。
       v1.32.0：原本這裡是 `$('dgm-start').disabled = !isFs();` —— **只手動拉回一個控制項**。
       🔴 改成整支 syncFs()：受 running 影響的東西不只一個。實測（probe3 的第 ② 項）
          漏掉這一支的後果是：量完一輪之後控制項卡在 disabled，再也回不來。
          手動一項一項拉回去這種寫法本身就是破口，收斂成一支才不會再漏。
       v1.34.0：按鈕的文字也一併由 syncFs() → dgmRenderBtns() 決定，這裡不再手動寫
          textContent —— 否則掉線之後會停在「重新量測」而不是關著的狀態。
       v1.35.0：**中心圓圈與底部提示也在那一支裡**（綁 running）⇒ 這一行同時就是
          「停止後／量完後圓圈立刻回來」的復原點，不必也不可以另外再寫一份。 */
    syncFs();
    if (aborted) {
      setGray(128);
      /* v1.30.0：原本這裡有 3 行、共 138 字（含「為什麼半套資料不能用」的整段理由）。
         留「發生了什麼、下一步按哪裡」，理由刪掉 —— 那段理由寫在下面 abort() 的
         程式碼註解裡，看得到的人是維護者，不是量測中的使用者。 */
      msg('已停止（' + aborted + '）：量到 ' + lastStep + ' 筆'
        + (lastGray === null ? '' : '，停在 ' + lastGray)
        + '，已跑 ' + fmtDur(elapsedMs()) + '。\n資料未回填，按「重新量測」重跑。', 'err');
      $('dgm-prog').innerHTML = '已停止'
        + '<small>' + (lastGray === null ? '尚未開始量測' : '停在 ' + lastGray)
        + '　已跑 ' + fmtDur(elapsedMs()) + '　未回填</small>';
    }
    /* v1.26.1：量測中被主控頁換任務 —— 等到這裡（run() 真的收工、running 已經
       是 false）才套用。在量測迴圈還在跑的時候換模式，會讓那一輪的畫面與資料
       對不上；而且上面那一段「已停止」的文字要先寫完，才輪到新任務覆蓋它。 */
    if (pendingTask) { var nt = pendingTask; pendingTask = null; dgmSetTask(nt); }
  }

  // 供驗證用的唯讀觀測點（比照 dg.html 的 window.dgApi）。只有 getter，改不動任何狀態。
  window.dgmProbe = {
    running: function () { return running; },
    aborted: function () { return aborted; },
    lastStep: function () { return lastStep; },
    lastGray: function () { return lastGray; },
    finished: function () { return finished; },
    elapsedMs: elapsedMs,
    isFullscreen: isFs,
    // v1.27.0 驗證用：兩條偵測路徑各自的原始值（收斂前），以及閘門的實際狀態
    fsApi: function () { return !!document.fullscreenElement; },
    fsDisplayMode: function () { return !!(DGM_MQ_FS && DGM_MQ_FS.matches); },
    gateBlocked: function () { return !!$('dgm-start').disabled; },
    portOpen: function () { return !!(port && port.readable); },
    steps: function () { return DGM_STEPS; },
    // v1.26.1 驗證用：目前是哪一個任務，以及本頁「這一次載入」的身分證。
    // 🔴 loadId 是在本 script 執行時產生的，只要頁面重新載入過就一定會變 ——
    //    用它才能證明「重用視窗時本頁沒有被重載」（＝序列埠連線沒有被打斷），
    //    而不是靠嘴巴說沒重載。
    mode: function () { return DGM_MODE; },
    task: function () { return DGM_TASK; },
    dest: function () { return DGM_DEST; },                                  // v1.27.0 驗證用
    stepText: function () { return $('dgm-step').textContent; },             // v1.27.0 驗證用
    what: function () { return DGM_WHAT; },                                  // v1.27.1 驗證用
    escHintShown: function () {                                              // v1.27.1 驗證用
      return !$('dgm-esc').classList.contains('dgm-hidden') && !!$('dgm-esc').offsetParent;
    },
    whatText: function () { return $('dgm-what').textContent; },             // v1.27.1 驗證用
    loadId: function () { return DGM_LOAD_ID; },
    taskSwitches: function () { return dgmSwitchCount; },
    // v1.30.0 驗證用：自適應係數與警示層的實際狀態（只有 getter，改不動任何東西）
    scaleK: function () { return dgmScale(); },
    scaleVar: function () {
      return getComputedStyle(document.documentElement).getPropertyValue('--dgm-k').trim();
    },
    zoomProbe: dgmZoom,
    glowOn: function () { return $('dgm-warn-glow').classList.contains('on'); },
    modalOn: function () { return $('dgm-warn-modal').classList.contains('on'); },
    warnDo: function () { return $('dgm-warn-do').textContent; },
    warnDo2: function () { return $('dgm-warn-do2').textContent; },
    // v1.32.0 驗證用：連線狀態、閘門的實際內容、狀態燈的實際 class／aria
    linkActive: function () { return dgmLinkActive; },
    linkBusy: function () { return dgmLinkBusy; },
    linkName: function () { return dgmLink.name; },
    gateLines: function () { return dgmGateLines(); },
    gateText: function () { return $('dgm-gate').textContent; },
    gateBoxes: function () {   // 🔴 合併呈現的驗證點：紅框永遠只有一個
      return document.querySelectorAll('#dgm-gate').length;
    },
    // v1.35.0 驗證用：常駐的連線鈕（連線 ⇄ 中斷連線）
    linkText: function () { return $('dgm-link').textContent; },
    linkDisabled: function () { return !!$('dgm-link').disabled; },
    linkVisible: function () {
      var e = $('dgm-link'), c = getComputedStyle(e), r = e.getBoundingClientRect();
      return c.display !== 'none' && c.visibility === 'visible' && r.width > 0 && r.height > 0;
    },
    // v1.35.0 驗證用：全螢幕鈕（雙向切換）與全螢幕的型別
    fsText: function () { return $('dgm-fs').textContent; },
    fsDisabled: function () { return !!$('dgm-fs').disabled; },
    fsKind: dgmFsKind,
    /* v1.35.0 驗證用：中心圓圈。
       🔴 這裡**故意不提供命中測試** —— #dgm-ring 整組是 `pointer-events: none`，
          elementsFromPoint 根本不會回傳它，寫出來會是一支永遠回 0 的假探針
          （第一版真的這樣寫，被截圖像素當場抓到：畫面上有 1656 個紅點、
          「命中測試」卻說 0）。
       🔴 畫面上到底有沒有紅色，唯一有效的證據是**截圖取像素**，那是驗證腳本的事。
          產品這邊只提供「有沒有被排版與繪製」這種它真的知道的事實：
          checkVisibility() 涵蓋 display／visibility／opacity／content-visibility，
          比只看 class 強，但仍然不等於像素。 */
    ringHiddenClass: function () { return $('dgm-ring').classList.contains('dgm-hidden'); },
    ringShown: function () {
      var e = $('dgm-ring');
      if (e.checkVisibility) return e.checkVisibility({ checkOpacity: true, checkVisibilityCSS: true });
      var c = getComputedStyle(e);
      return c.display !== 'none' && c.visibility !== 'hidden';
    },
    ringRect: function () {
      var r = $('dgm-ring').getBoundingClientRect();
      return { w: +r.width.toFixed(1), h: +r.height.toFixed(1) };
    },
    // v1.35.0 驗證用：遲滯的三個時間點與它的組成（都是原始數字，不是結論）
    hz: dgmHz,
    fpsHz: function () { return dgmFpsHz; },
    mvsHz: function () { return dgmMvsHz; },
    ringClearMs: dgmRingClearMs,
    ringClearUsedMs: function () { return dgmRingClearUsedMs; },   // 這一輪實際等的毫秒數
    hzUsed: function () { return dgmHzUsed; },                     // 算它時用的更新率
    ringFrames: function () { return DGM_RING_FRAMES; },
    gtgMs: function () { return DGM_GTG_MS; },
    ringGoneAt: function () { return dgmRingGoneAt; },
    firstTxAt: function () { return dgmFirstTxAt; },
    firstMesAt: function () { return dgmFirstMesAt; },
    readLoopRunning: function () { return readLoopRunning; },
    // v1.34.0 驗證用：合一之後那顆主按鈕的狀態、文字、開關（讀的是真的 DOM）
    mainMode: function () { return dgmMainMode(); },
    mainText: function () { return $('dgm-start').textContent; },
    mainDisabled: function () { return !!$('dgm-start').disabled; },
    mainClass: function () { return $('dgm-start').className; },
    stopArmMs: function () { return DGM_STOP_ARM_MS; },
    /* v1.38.0 驗證用：連線診斷 log 與新入口。
       🔴 logText() 回的就是「複製 log」會放進剪貼簿的那一份（同一支
          dgmLogText()），所以「剪貼簿內容 ＝ 畫面內容」是同一個事實，
          不是兩份各自維護的字串。 */
    logText: dgmLogText,
    logLines: function () {
      var ds = $('dgm-log').querySelectorAll('div'), out = [], i;
      for (i = 0; i < ds.length; i++) out.push({ cls: ds[i].className, t: ds[i].textContent });
      return out;
    },
    logFontPx: function (big) {
      var e = $('dgm-log').querySelector(big ? 'div.lk' : 'div:not(.lk)');
      return e ? getComputedStyle(e).fontSize : null;
    },
    copyLog: dgmCopyLog,
    copyText: function () { return $('dgm-log-copy').textContent; },
    pickText: function () { return $('dgm-pick').textContent; },
    pickDisabled: function () { return !!$('dgm-pick').disabled; },
    pickedPort: function () { return dgmPickedPort ? dgmPortInfo(dgmPickedPort) : null; },
    linkPick: dgmLinkPick
  };

  async function run() {
    /* 閘門第三層：run() 自己也不信任呼叫端（將來若多一條啟動路徑，這裡照樣擋）。
       v1.32.0：同樣讀 dgmGateLines() —— 全螢幕與連線兩條一起擋，不自己判一次。 */
    var gate0 = dgmGateLines();
    if (gate0.length) { msg(gate0.join('\n'), 'err'); return; }
    /* v1.27.0：用 `!navigator.serial` 而不是 `'serial' in navigator` ——
       後者只看屬性在不在，值是 undefined 時仍然為真，等於沒擋到。 */
    if (!navigator.serial) { msg(DGM_ERR.unsupported, 'err'); return; }

    /* 1. 把序列埠接回可用狀態。
       v1.32.0：這一段原本就寫在這裡（取埠 → 開埠 → 起 readLoop），現在搬進
       dgmSerialOn()，run() 呼叫同一支 —— 程式碼與順序完全沒動。
       🔴 為什麼連線之後這裡還要再叫一次：上一輪跑完時 closePort() 會把埠關掉
          （COM,0 → close 是既有的收尾程序），使用者按「重新量測」時埠是關的，
          要用同一組參數重開。埠還開著時這一支走的是「沿用上一次已經開著的埠」。 */
    msg('連線中…');
    if (!(await dgmSerialOn())) { dgmSetLink(false); return; }
    if (aborted) return;

    // 2. 初始化
    for (var i = 0; i < INIT.length; i++) {
      msg('設定中 ' + (i + 1) + '/' + INIT.length + '：' + INIT[i][1]);
      var r = await cmd(INIT[i][0], 6000);
      if (aborted) return;
      if (r === null) { msg('沒有回應，卡在 ' + INIT[i][0] + '。', 'err'); await closePort(); return; }
      if (/^ER/.test(r) && INIT[i][0] === 'SCS,3') {
        log('UNIVERSAL 被拒，退回 INTERNAL 60Hz', 'e');
        r = await cmd('SCS,4,60.00', 6000);
        if (aborted) return;
      }
      if (/^ER/.test(r || '')) { msg('機器回錯誤 ' + r + '（' + INIT[i][0] + '）', 'err'); await closePort(); return; }
    }

    // 2.5 順便向儀器問畫面更新率（跟左上角那個 rAF 實測值分開標示）
    msg('偵測畫面更新率…');
    for (var k = 0; k < HZ_GUESS.length; k++) {
      var mv = await cmd('MVS,' + HZ_GUESS[k], 8000);
      if (aborted) return;
      if (mv && /^OK/.test(mv)) {
        var hz = parseFloat(mv.split(',')[1]);
        // v1.35.0：數值另外留一份 —— 下一輪開始量測前的遲滯要拿它算畫面週期
        if (!isNaN(hz)) { dgmMvsHz = hz; $('dgm-mvs').textContent = hz.toFixed(2) + ' Hz'; break; }
      }
    }
    if ($('dgm-mvs').textContent === '—') $('dgm-mvs').textContent = '測不到';

    // 3. 零校正
    msg('零校正中 —— 蓋上遮光蓋，十秒別動。');
    var z = await cmd('ZRC', 40000);
    if (aborted) return;
    if (z === null || /^ER/.test(z)) {
      msg('零校正失敗（' + (z || '逾時') + '）—— 蓋好遮光蓋再按一次。', 'err');
      await closePort(); return;
    }
    for (var s = 5; s > 0; s--) {
      msg('打開遮光蓋，探頭對準中心。' + s + ' 秒後開始。');
      await waitOrAbort(1000);
      if (aborted) return;
    }

    // 4. 逐階（或逐色）量測。兩種模式只差「畫面填什麼」與「回報的第一欄是什麼」。
    var rows = [], bad = 0;
    msg('量測中，別動探頭。');
    for (var g = 0; g < DGM_STEPS; g++) {
      var key;
      if (DGM_MODE === 'prim') {
        var pc = DGM_PRIMS[g];
        key = pc[0];
        setFill(pc[2][0], pc[2][1], pc[2][2], pc[1]);
        progLabel = pc[1];
      } else {
        key = g;
        setGray(g);
        progLabel = 'L' + g;                 // 進度＝正在量的那一階的實際灰階
      }
      renderProg();
      await painted();
      if (aborted) return;
      await waitOrAbort(DGM_SETTLE_MS);
      if (aborted) return;

      var res = await cmd('MES,1', 20000);
      if (aborted) return;
      if (res === null || /^ER/.test(res)) {
        if (++bad >= 3) { msg('連續三次量測失敗（' + (res || '逾時') + '），停在 ' + progLabel + '。', 'err'); break; }
        g--; continue;                       // 同一步重試
      }
      bad = 0;
      // OK00,P1,狀態,x,y,Lv,…　→　x=索引3、y=索引4、Lv=索引5
      var p = res.split(',');
      var x = parseFloat(p[3]), y = parseFloat(p[4]), lv = parseFloat(p[5]);
      if (isNaN(x) || isNaN(y) || isNaN(lv)) {
        // 原始回應只進左下角 log（那是給維護者看的），畫面上只留一句
        if (++bad >= 3) { log('解不出的回應：' + res, 'e');
                          msg('回應解不出 x／y／Lv，停在 ' + progLabel + '。', 'err'); break; }
        g--; continue;
      }
      rows.push([key, x, y, lv]);
      lastStep = rows.length; lastGray = progLabel;
    }
    if (aborted) return;

    await closePort();
    setGray(128);

    // 5. 回傳給 DG 主視窗
    // prim 要三筆都到齊才有意義（少一個端點就湊不出色彩矩陣）；gray 沿用原本的門檻
    var need = (DGM_MODE === 'prim') ? DGM_PRIMS.length : 2;
    if (rows.length < need) {
      msg('只量到 ' + rows.length + ' 筆（需要 ' + need + ' 筆），沒有回傳。', 'err'); return;
    }
    if (!window.opener || window.opener.closed) {
      msg('找不到 DG 分頁 —— 回 DG 頁重新按「即時量測」。', 'err');
      return;
    }
    window.opener.postMessage(
      // v1.26.1：帶回任務編號 —— DG 頁靠它認出「這批資料是哪一次按鈕要的」
      { type: 'dg-measure-result', mode: DGM_MODE, label: '即時量測', task: DGM_TASK,
        at: new Date().toLocaleString(), rows: rows },
      DGM_TARGET_ORIGIN);
    var span = (DGM_MODE === 'prim')
      ? 'R／G／B 三個純色端點'
      : ('L' + rows[0][0] + ' ～ L' + rows[rows.length - 1][0]);
    var partNo = (DGM_MODE === 'prim') ? '第 3 部分' : '第 2 部分';

    $('dgm-prog').innerHTML = '完成'
      + '<small>' + span + '　共 ' + rows.length + ' 筆'
      + '　總共跑了 ' + fmtDur(elapsedMs()) + '</small>';
    /* v1.26.2：量完只留這一句 —— 這一輪完成了、資料已經回到哪裡。
       不解釋、也不提關掉分頁（原本的 #dgm-done 說明框與「關閉這個分頁」鈕已移除）。 */
    msg('✔ 已完成：' + rows.length + ' 筆已回到 DG 的' + partNo + '。', 'ok');
  }

  /* v1.26.1：右上角那塊是 .dgm-corner，**max-height: 30vh 且 overflow: hidden**。
     實測（1280×860 視窗、prim 模式）：全螢幕閘門的紅框 ＋ 模式說明本來就已經
     用掉幾乎整個高度，我原本在 #dgm-msg 前面多加一行「已切到第 X 部分」，
     結果把「依序顯示純紅、純綠、純藍…」那一行擠出可視範圍、被裁掉。
     🔴 所以換任務的提示**不放在 #dgm-msg**（那一格沒有多的高度可用），
        改放底部置中的 #dgm-hint —— 它沒有高度上限、字更大、而且本來就是
        「現在該做什麼」那一條。#dgm-msg 維持與「直接用該模式開新頁」一字不差。 */
  var DGM_HINT_BASE = $('dgm-hint').innerHTML;

  /* v1.12.0：prim 模式只換標籤與文案，流程與閘門完全共用。
     v1.26.1：抽成函式 —— 換任務時兩個方向都要走得回去，不能只有「進 prim」這一條。
     🔴 #dgm-hint 兩種模式的文字**本來就一模一樣**（只差原始碼裡的換行），
        所以不放進來；放進來只會多一份要同步維護的重複文字。 */
  /* v1.32.0：訊息列的預設那一句抽成一支（原本只寫在 dgmApplyModeUi 裡）。
     連線成功時也要用到它，兩邊各寫一份遲早會不一致。字串一字未改。 */
  function dgmMsgDefault() {
    $('dgm-msg').textContent = (DGM_MODE === 'prim')
      ? '連線 → 初始化 → 零校正（蓋遮光蓋）→ 量紅、綠、藍。'
      : '連線 → 初始化 → 零校正（蓋遮光蓋）→ 掃 L0～L255。';
    $('dgm-msg').className = '';
  }

  function dgmApplyModeUi() {
    if (DGM_MODE === 'prim') {
      document.title = '即時量測（RGB 純色）— DG — TCON FAE專用工具箱';
      $('dgm-gray-k').textContent = '目前純色';
      setFill(128, 128, 128, '—');
    } else {
      document.title = '即時量測 — DG — TCON FAE專用工具箱';
      $('dgm-gray-k').textContent = '目前灰階值';
      setGray(128);
    }
    dgmMsgDefault();
  }

  /* ═══ v1.26.1：換一個量測任務（不重新載入本頁）═══════════════════════════
     🔴 為什麼一定要清狀態：使用者可能在第 2 部分量到一半改去按第 3 部分。
        若不清，上一輪的 aborted／lastStep／進度計時器會殘留，畫面會拿上一個
        任務的數字說話；更嚴重的是若讓 run() 邊跑邊被換掉模式，那一輪量到的
        半套資料就會被算到新入口頭上。所以：
          · 量測正在跑 → 先 abort（abort 之後 run() 一定在中途 return，
            **不會 postMessage**，所以舊資料絕不會外流），把新任務排隊，
            等那一輪真的收工再套用（見 dgm-start 的處理器結尾）。
          · 沒在跑 → 立刻套用。
     🔴 序列埠（port / keepReading / readLoop）刻意**不動** —— 它不帶任何量測
        資料，留著才不用叫使用者重選一次埠，這與原本「停止後直接重新量測」
        沿用同一個埠是同一個道理。 */
  var pendingTask = null;

  function dgmSetTask(t) {
    DGM_MODE = (t.mode === 'prim') ? 'prim' : 'gray';
    DGM_STEPS = (DGM_MODE === 'prim') ? DGM_PRIMS.length : 256;
    DGM_TASK = (typeof t.task === 'number') ? t.task : DGM_TASK;
    /* v1.27.0：🔴 步驟名稱一定要跟著換 —— 換了任務卻還顯示上一個步驟的名字，
       比不顯示更糟（使用者會照著錯的步驟去擺探頭）。 */
    DGM_DEST = String(t.dest || '');
    DGM_WHAT = String(t.what || '');   // v1.27.1：量測內容跟步驟名稱同一條更新路徑

    // ① 上一輪的殘留狀態一律歸零
    aborted = null; lastStep = 0; lastGray = null; finished = false;
    progStop(); scanT0 = 0; progLabel = '準備中';
    rxBuf = '';
    if (pending) { clearTimeout(pending.timer); pending.resolve(null); pending = null; }
    $('dgm-prog').innerHTML = '';

    /* ② 畫面回到「還沒開始量」的樣子
       v1.35.0：圓圈與底部提示原本在這裡手動 remove class ——
       🔴 而這裡是它們**唯一**的復原點，所以停止後／量完後／中斷連線後都回不來
          （沒有人會來換任務）。改成綁 running 之後由 dgmRenderBtns() 一起處理，
          這一段就不必也不可以再寫一份，否則又會變成兩個來源。
       主按鈕的文字同理不在這裡寫死 —— 上面已經把 finished 歸零，
       文字由下面那一支 syncFs() → dgmRenderBtns() 依當下狀態決定。 */
    dgmApplyModeUi();
    dgmRenderStep();
    syncFs();

    dgmSwitchCount++;
    // dest 是訊息帶進來的字串，寫進 innerHTML 之前一律跳脫（來源同源不代表可以不跳脫）
    var where = String(t.dest || '').replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
    log('主控頁切換量測任務' + (where ? '：' + where : '') + '（' + DGM_MODE + '）', 'o');
    /* v1.30.0：括號裡那段（「這個分頁沒有重開，你擺的位置與儀器連線都維持原樣」）
       是解釋，砍掉 —— 位置與連線本來就沒動，使用者看畫面就知道。 */
    $('dgm-hint').innerHTML =
      '<b style="color:#4ade80">已切到'
      + (where ? '「' + where + '」' : '新的任務') + '</b><br>' + DGM_HINT_BASE;
  }

  function dgmApplyTask(t) {
    if (running) {
      pendingTask = t;
      abort('主控頁換到別的量測任務');
      return;
    }
    dgmSetTask(t);
  }

  /* 只收同源、且格式對得上的訊息；來源還要真的是開這一頁的那個視窗。
     （file:// 之下 origin 會是 'null'，那條路本來就走不通，見上面 DGM_TARGET_ORIGIN） */
  window.addEventListener('message', function (e) {
    if (e.origin !== location.origin) return;
    if (window.opener && e.source !== window.opener) return;
    var d = e.data;
    if (!d || d.type !== 'dg-measure-task') return;
    dgmApplyTask(d);
  });

  // 起始狀態：開始鈕的開關、全螢幕狀態列、閘門說明都由這一支決定，不另寫一份
  dgmApplyModeUi();
  dgmRenderStep();
  syncFs();
})();
</script>
</body>
</html>
