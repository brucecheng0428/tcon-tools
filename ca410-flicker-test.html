<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CA-410 Flicker 即時波形 v0.4</title>
<style>
  :root{color-scheme:dark}
  body{margin:0;padding:16px;background:#0b1220;color:#e2e8f0;
       font:14px/1.6 -apple-system,"PingFang TC","Noto Sans TC",sans-serif}
  h1{font-size:18px;margin:0 0 4px}
  .ver{display:inline-block;background:#a78bfa;color:#2e1065;font-size:11px;font-weight:700;
       padding:2px 7px;border-radius:5px;vertical-align:middle;margin-left:6px}
  .sub{color:#94a3b8;font-size:12px;margin-bottom:14px}
  .card{background:#111c33;border:1px solid #1e2d4d;border-radius:10px;padding:14px;margin-bottom:12px}
  .card h2{font-size:14px;margin:0 0 10px;color:#7dd3fc}
  button{background:#2563eb;color:#fff;border:0;border-radius:7px;padding:9px 14px;
         font-size:14px;cursor:pointer;margin:0 6px 6px 0}
  button.sec{background:#334155} button.go{background:#16a34a} button.stop{background:#dc2626}
  button:disabled{opacity:.4;cursor:not-allowed}
  select,input{background:#0b1220;color:#e2e8f0;border:1px solid #334155;
               border-radius:6px;padding:7px 9px;font-size:14px;margin:0 6px 6px 0}
  #log{background:#050b16;border:1px solid #1e2d4d;border-radius:8px;padding:10px;
       height:170px;overflow:auto;font:12px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap}
  .ok{color:#4ade80}.err{color:#f87171}.info{color:#7dd3fc}.dim{color:#64748b}.warn{color:#fbbf24}
  .row{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
  code{background:#0b1220;padding:1px 5px;border-radius:4px;color:#fbbf24}
  canvas{width:100%;height:340px;background:#050b16;border:1px solid #1e2d4d;border-radius:8px;display:block}
  .stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
  .stat{background:#0b1220;border:1px solid #1e2d4d;border-radius:8px;padding:8px 12px;min-width:104px}
  .stat .k{font-size:11px;color:#94a3b8}
  .stat .v{font-size:19px;font-weight:700;font-family:ui-monospace,Menlo,monospace}
  .note{border-left:3px solid #fbbf24;padding:6px 10px;margin:8px 0 0;background:#1a1608;
        font-size:12px;color:#fde68a;border-radius:0 6px 6px 0}
</style>
</head>
<body>
<h1>CA-410 Flicker 即時波形<span class="ver">v0.4</span></h1>
<div class="sub">橫軸時間、縱軸 FMA（%）。FMA 越大代表閃爍越嚴重。</div>

<div class="card">
  <h2>① 連線</h2>
  <div class="row">
    <button id="btn-req">選擇序列埠…</button>
    鮑率 <select id="baud"><option>9600</option><option selected>38400</option><option>19200</option><option>57600</option><option>115200</option></select>
    <button id="btn-open" disabled>開啟</button>
    <button id="btn-close" class="sec" disabled>關閉</button>
    <span id="envmsg" class="dim"></span>
  </div>
</div>

<div class="card">
  <h2>② 量測</h2>
  <div class="row">
    <button class="go" id="btn-init" disabled>初始化（含零校正）</button>
    <button class="go" id="btn-start" disabled>▶ 開始即時量測</button>
    <button class="stop" id="btn-stop" disabled>■ 停止</button>
    <button class="sec" id="btn-csv" disabled>匯出 CSV</button>
    <button class="sec" id="btn-reset" disabled>清空曲線</button>
  </div>
  <div class="row" style="margin-top:8px">
    視窗 <select id="win"><option value="30">最近 30 秒</option><option value="60" selected>最近 60 秒</option><option value="120">最近 2 分</option><option value="0">全部</option></select>
    間隔 <select id="gap"><option value="0" selected>不等待（越快越好）</option><option value="200">200 ms</option><option value="500">500 ms</option><option value="1000">1 秒</option></select>
  </div>
  <div class="note">初始化會依序送 <code>COM,1</code> → <code>SCS,4,60.00</code> → <code>FSC,1</code> → <code>OPR,1</code> → <code>MMS,0</code> → <code>FMS,0</code>（FMA 法）→ <code>MDS,0</code> → <code>MCH,0</code> → <code>LUS,1</code> → <code>ZRC</code>。<b>零校正前請蓋上遮光蓋</b>，跑完再打開對準畫面，然後按「開始即時量測」。</div>
</div>

<div class="card">
  <h2>③ 即時波形</h2>
  <canvas id="cv"></canvas>
  <div class="stats">
    <div class="stat"><div class="k">目前 FMA</div><div class="v ok" id="s-now">—</div></div>
    <div class="stat"><div class="k">最大</div><div class="v err" id="s-max">—</div></div>
    <div class="stat"><div class="k">最小</div><div class="v" id="s-min">—</div></div>
    <div class="stat"><div class="k">平均</div><div class="v" id="s-avg">—</div></div>
    <div class="stat"><div class="k">取樣數</div><div class="v dim" id="s-n">0</div></div>
    <div class="stat"><div class="k">速率</div><div class="v dim" id="s-rate">—</div></div>
    <div class="stat"><div class="k">目前 Lv</div><div class="v dim" id="s-lv">—</div></div>
  </div>
</div>

<div class="card">
  <h2>紀錄</h2>
  <div id="log"></div>
  <div class="row" style="margin-top:8px">
    <button class="sec" id="btn-copy">複製紀錄</button>
    <button class="sec" id="btn-clearlog">清空紀錄</button>
  </div>
</div>

<script>
const VERSION='v0.4';
const $=id=>document.getElementById(id);
const logEl=$('log');
function log(m,c){const d=document.createElement('div');if(c)d.className=c;
  d.textContent='['+new Date().toTimeString().slice(0,8)+'] '+m;logEl.appendChild(d);logEl.scrollTop=logEl.scrollHeight;}

$('envmsg').textContent = ('serial' in navigator && window.isSecureContext)
  ? '（Web Serial 可用 '+VERSION+'）' : '（這個瀏覽器不支援 Web Serial，請用 Chrome 或 Edge）';
if(!('serial' in navigator)) $('btn-req').disabled=true;

let port=null, reader=null, keepReading=false, rxBuf='', pending=null;
let running=false, samples=[], t0=0;

async function sendCmd(text, waitMs){
  if(!port||!port.writable) return null;
  const wait=new Promise(res=>{pending={resolve:res,timer:setTimeout(()=>{pending=null;res(null);},waitMs||5000)};});
  try{
    const w=port.writable.getWriter();
    await w.write(new TextEncoder().encode(text+'\r'));
    w.releaseLock();
  }catch(e){ log('送出失敗：'+e.message,'err'); pending=null; return null; }
  return wait;
}
async function readLoop(){
  try{
    while(port.readable && keepReading){
      reader=port.readable.getReader();
      try{
        while(true){
          const {value,done}=await reader.read();
          if(done) break;
          if(!value||!value.length) continue;
          rxBuf+=new TextDecoder().decode(value);
          let i;
          while((i=rxBuf.indexOf('\r'))>=0){
            const line=rxBuf.slice(0,i); rxBuf=rxBuf.slice(i+1);
            if(pending){const p=pending;pending=null;clearTimeout(p.timer);p.resolve(line);}
          }
        }
      } finally { reader.releaseLock(); }
    }
  }catch(e){ if(keepReading) log('讀取中斷：'+e.message,'err'); }
}

$('btn-req').onclick=async()=>{
  try{ port=await navigator.serial.requestPort();
    const i=port.getInfo();
    log('已選埠 vendorId=0x'+(i.usbVendorId||0).toString(16)+' productId=0x'+(i.usbProductId||0).toString(16),'ok');
    $('btn-open').disabled=false;
  }catch(e){ log('沒有選到埠：'+e.message,'err'); }
};
$('btn-open').onclick=async()=>{
  try{
    await port.open({baudRate:Number($('baud').value),dataBits:8,stopBits:1,parity:'none'});
    log('埠已開啟。','ok');
    $('btn-open').disabled=true;$('btn-close').disabled=false;$('btn-init').disabled=false;
    keepReading=true;rxBuf='';readLoop();
  }catch(e){
    log('開啟失敗：'+e.message,'err');
    if(/in use|Failed to open/i.test(e.message)) log('埠可能被原廠 UI 佔住，請先關掉它。','info');
  }
};
$('btn-close').onclick=async()=>{
  running=false; keepReading=false;
  try{ if(reader) await reader.cancel(); }catch(e){}
  try{ await port.close(); log('埠已關閉。','info'); }catch(e){}
  $('btn-open').disabled=false;$('btn-close').disabled=true;
  $('btn-init').disabled=true;$('btn-start').disabled=true;$('btn-stop').disabled=true;
};

const INIT=[['COM,1','開始通訊'],['SCS,4,60.00','同步 INTERNAL 60Hz'],['FSC,1','速度 FAST'],
  ['OPR,1','輸出探頭 P1'],['MMS,0','色彩＋閃爍同時'],['FMS,0','FMA 法'],['MDS,0','顯示 x,y,Lv'],
  ['MCH,0','校正通道 CH00'],['LUS,1','單位 cd/m²'],['ZRC','零校正（請蓋遮光蓋）',30000]];

$('btn-init').onclick=async()=>{
  $('btn-init').disabled=true;
  log('──── 初始化開始 ────','info');
  for(let i=0;i<INIT.length;i++){
    const [c,why,to]=INIT[i];
    const r=await sendCmd(c,to||5000);
    if(r===null){ log('第 '+(i+1)+' 步 '+c+' 逾時，中止。','err'); $('btn-init').disabled=false; return; }
    if(/^ER/.test(r)){ log('第 '+(i+1)+' 步 '+c+' 回 '+r+'，中止。','err'); $('btn-init').disabled=false; return; }
    log((i+1)+'/'+INIT.length+' '+c+'（'+why+'）→ '+r,'ok');
  }
  log('──── 初始化完成，可以開始量測 ────','ok');
  $('btn-start').disabled=false; $('btn-init').disabled=false;
};

function parseMES(line){
  // OK00,P1,0,x,y,Lv,FMA,?
  const p=line.split(',');
  if(p.length<7||!/^OK/.test(p[0])) return null;
  return { lv:parseFloat(p[5]), fma:parseFloat(p[6]), raw:line };
}

$('btn-start').onclick=async()=>{
  running=true;
  $('btn-start').disabled=true;$('btn-stop').disabled=false;
  $('btn-csv').disabled=false;$('btn-reset').disabled=false;
  if(!samples.length) t0=performance.now();
  log('開始連續量測。','info');
  let firstShown=false, errN=0;
  while(running){
    const r=await sendCmd('MES,1',20000);
    if(!running) break;
    if(r===null){ log('量測逾時，停止。','err'); break; }
    if(/^ER/.test(r)){
      errN++;
      log('回 '+r+(errN===1?'（若是 ER10，代表初始化沒做完整）':''),'err');
      if(errN>=3){ log('連續錯誤，停止。','err'); break; }
      continue;
    }
    errN=0;
    const m=parseMES(r);
    if(!m||isNaN(m.fma)){ log('回應看不懂：'+r,'warn'); continue; }
    if(!firstShown){ log('第一筆原始回應：'+r,'dim'); firstShown=true; }
    samples.push({t:(performance.now()-t0)/1000, fma:m.fma, lv:m.lv});
    draw(); updateStats();
    const gap=Number($('gap').value);
    if(gap) await new Promise(res=>setTimeout(res,gap));
  }
  running=false;
  $('btn-start').disabled=false;$('btn-stop').disabled=true;
  log('量測停止，共 '+samples.length+' 筆。','info');
};
$('btn-stop').onclick=()=>{ running=false; };
$('btn-reset').onclick=()=>{ samples=[]; t0=performance.now(); draw(); updateStats(); };

function visible(){
  const w=Number($('win').value);
  if(!w||!samples.length) return samples;
  const end=samples[samples.length-1].t;
  return samples.filter(s=>s.t>=end-w);
}
function updateStats(){
  const v=visible();
  if(!v.length){ ['s-now','s-max','s-min','s-avg','s-lv','s-rate'].forEach(i=>$(i).textContent='—'); $('s-n').textContent='0'; return; }
  const f=v.map(s=>s.fma);
  const last=v[v.length-1];
  $('s-now').textContent=last.fma.toFixed(3);
  $('s-max').textContent=Math.max(...f).toFixed(3);
  $('s-min').textContent=Math.min(...f).toFixed(3);
  $('s-avg').textContent=(f.reduce((a,b)=>a+b,0)/f.length).toFixed(3);
  $('s-n').textContent=samples.length;
  $('s-lv').textContent=isNaN(last.lv)?'—':last.lv.toFixed(3);
  if(v.length>1){
    const dur=v[v.length-1].t-v[0].t;
    $('s-rate').textContent=dur>0?((v.length-1)/dur).toFixed(1)+' /s':'—';
  }
}
function draw(){
  const cv=$('cv'), dpr=window.devicePixelRatio||1;
  const W=cv.clientWidth, H=cv.clientHeight;
  if(cv.width!==W*dpr||cv.height!==H*dpr){ cv.width=W*dpr; cv.height=H*dpr; }
  const g=cv.getContext('2d');
  g.setTransform(dpr,0,0,dpr,0,0);
  g.clearRect(0,0,W,H);
  const L=54,R=12,T=14,B=30, w=W-L-R, h=H-T-B;
  const v=visible();
  g.strokeStyle='#1e2d4d'; g.fillStyle='#64748b'; g.font='11px ui-monospace,Menlo,monospace';
  if(!v.length){ g.fillText('尚無資料',L+8,T+18); g.strokeRect(L,T,w,h); return; }
  const xs=v.map(s=>s.t), ys=v.map(s=>s.fma);
  let x0=Math.min(...xs), x1=Math.max(...xs);
  if(x1-x0<1e-6) x1=x0+1;
  let y0=Math.min(...ys), y1=Math.max(...ys);
  const pad=Math.max((y1-y0)*0.15, 0.02);
  y0-=pad; y1+=pad;
  const X=t=>L+(t-x0)/(x1-x0)*w, Y=f=>T+h-(f-y0)/(y1-y0)*h;
  // 格線
  for(let i=0;i<=4;i++){
    const yy=T+h*i/4, val=y1-(y1-y0)*i/4;
    g.strokeStyle='#16233d'; g.beginPath(); g.moveTo(L,yy); g.lineTo(L+w,yy); g.stroke();
    g.fillStyle='#64748b'; g.textAlign='right'; g.fillText(val.toFixed(2),L-6,yy+4);
  }
  g.textAlign='center';
  for(let i=0;i<=4;i++){
    const xx=L+w*i/4, tv=x0+(x1-x0)*i/4;
    g.strokeStyle='#16233d'; g.beginPath(); g.moveTo(xx,T); g.lineTo(xx,T+h); g.stroke();
    g.fillStyle='#64748b'; g.fillText(tv.toFixed(1)+'s',xx,T+h+16);
  }
  // 零線
  if(y0<0&&y1>0){ g.strokeStyle='#475569'; g.setLineDash([4,3]); g.beginPath(); g.moveTo(L,Y(0)); g.lineTo(L+w,Y(0)); g.stroke(); g.setLineDash([]); }
  // 曲線
  g.strokeStyle='#38bdf8'; g.lineWidth=1.6; g.beginPath();
  v.forEach((s,i)=>{ const px=X(s.t), py=Y(s.fma); i?g.lineTo(px,py):g.moveTo(px,py); });
  g.stroke();
  g.strokeStyle='#1e2d4d'; g.lineWidth=1; g.strokeRect(L,T,w,h);
  g.fillStyle='#94a3b8'; g.textAlign='left'; g.fillText('FMA (%)',L+4,T+11);
}
window.addEventListener('resize',draw);

$('btn-csv').onclick=()=>{
  const rows=[['time_s','FMA_percent','Lv_cd_m2']].concat(
    samples.map(s=>[s.t.toFixed(4),s.fma,isNaN(s.lv)?'':s.lv]));
  const blob=new Blob([rows.map(r=>r.join(',')).join('\n')],{type:'text/csv'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='flicker_'+new Date().toISOString().slice(0,19).replace(/[:T]/g,'')+'.csv';
  a.click();
  log('已匯出 '+samples.length+' 筆。','ok');
};
$('btn-copy').onclick=()=>navigator.clipboard.writeText(logEl.innerText).then(()=>log('已複製。','ok'));
$('btn-clearlog').onclick=()=>logEl.innerHTML='';
draw();
</script>
</body>
</html>
