<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CA-410 Flicker 一鍵測試 v0.7</title>
<style>
  :root{color-scheme:dark}
  body{margin:0;padding:16px;background:#0b1220;color:#e2e8f0;
       font:15px/1.6 -apple-system,"PingFang TC","Noto Sans TC",sans-serif}
  h1{font-size:19px;margin:0 0 2px}
  .ver{display:inline-block;background:#a78bfa;color:#2e1065;font-size:12px;font-weight:700;
       padding:2px 8px;border-radius:5px;vertical-align:middle;margin-left:8px}
  .sub{color:#94a3b8;font-size:13px;margin-bottom:16px}
  .big{width:100%;background:#16a34a;color:#fff;border:0;border-radius:12px;
       padding:22px;font-size:22px;font-weight:700;cursor:pointer;margin-bottom:14px}
  .big:disabled{background:#334155;color:#94a3b8;cursor:not-allowed}
  .stage{background:#111c33;border:2px solid #1e2d4d;border-radius:12px;padding:18px;margin-bottom:14px}
  .stage .now{font-size:20px;font-weight:700;color:#7dd3fc}
  .stage .det{font-size:13px;color:#94a3b8;margin-top:4px;
              font-family:ui-monospace,Menlo,monospace;word-break:break-all}
  .stage.err{border-color:#dc2626} .stage.err .now{color:#f87171}
  .stage.ok{border-color:#16a34a} .stage.ok .now{color:#4ade80}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
  .box{background:#111c33;border:1px solid #1e2d4d;border-radius:10px;padding:12px 14px}
  .box .k{font-size:12px;color:#94a3b8}
  .box .v{font-size:26px;font-weight:700;font-family:ui-monospace,Menlo,monospace;line-height:1.25}
  .v.good{color:#4ade80}.v.bad{color:#f87171}.v.dim{color:#64748b}
  canvas{width:100%;height:300px;background:#050b16;border:1px solid #1e2d4d;
         border-radius:10px;display:block;margin-bottom:14px}
  details{background:#111c33;border:1px solid #1e2d4d;border-radius:10px;padding:10px 14px}
  summary{cursor:pointer;color:#7dd3fc;font-size:13px}
  #log{margin-top:10px;background:#050b16;border-radius:8px;padding:10px;height:260px;
       overflow:auto;font:12px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap}
  .ok{color:#4ade80}.err{color:#f87171}.info{color:#7dd3fc}.dim{color:#64748b}.warn{color:#fbbf24}
  button.sec{background:#334155;color:#fff;border:0;border-radius:7px;padding:8px 13px;
             font-size:13px;cursor:pointer;margin:8px 6px 0 0}
</style>
</head>
<body>
<h1>CA-410 Flicker 一鍵測試<span class="ver">v0.7</span></h1>
<div class="sub">按下去就會自己跑完。中途只有一件事要你做：聽到提示時把遮光蓋打開、對準畫面。</div>

<button class="big" id="go">開始測試</button>

<div class="stage" id="stage">
  <div class="now" id="now">還沒開始</div>
  <div class="det" id="det">按上面那顆綠色按鈕。第一次會跳出序列埠清單，選 CA-410 那個。原廠 UI 要先關掉。</div>
</div>

<div class="grid">
  <div class="box"><div class="k">FMA 平均（%）</div><div class="v good" id="v-avg">—</div></div>
  <div class="box"><div class="k">FMA 最大（%）</div><div class="v bad" id="v-max">—</div></div>
  <div class="box"><div class="k">亮度 Lv（cd/m²）</div><div class="v" id="v-lv">—</div></div>
  <div class="box"><div class="k">取樣（筆 / 每秒）</div><div class="v dim" id="v-n">—</div></div>
  <div class="box"><div class="k">畫面更新率（Hz）</div><div class="v" id="v-hz">—</div></div>
</div>

<canvas id="cv"></canvas>
<canvas id="cw" style="height:240px"></canvas>

<details>
  <summary>詳細紀錄（出問題時打開，把這裡拍給我）</summary>
  <div id="log"></div>
  <button class="sec" id="btn-copy">複製全部</button>
  <button class="sec" id="btn-csv">匯出 CSV</button>
</details>

<script>
const $=id=>document.getElementById(id);
const logEl=$('log');
function log(m,c){const d=document.createElement('div');if(c)d.className=c;
  d.textContent='['+new Date().toTimeString().slice(0,8)+'] '+m;logEl.appendChild(d);logEl.scrollTop=logEl.scrollHeight;}
function stage(now,det,cls){
  $('now').textContent=now; $('det').textContent=det||'';
  $('stage').className='stage'+(cls?' '+cls:'');
}

let port=null,reader=null,keepReading=false,rxBuf='',pending=null;
let samples=[],wave=[],t0=0;

async function cmd(text,waitMs){
  if(!port||!port.writable) return null;
  const wait=new Promise(res=>{pending={resolve:res,timer:setTimeout(()=>{pending=null;res(null);},waitMs||5000)};});
  try{
    const w=port.writable.getWriter();
    await w.write(new TextEncoder().encode(text+'\r'));
    w.releaseLock();
  }catch(e){ log('送出失敗 '+text+'：'+e.message,'err'); pending=null; return null; }
  const r=await wait;
  log(text+'  →  '+(r===null?'（逾時，沒有回應）':r), r===null?'err':(/^ER/.test(r)?'err':'dim'));
  return r;
}
async function readLoop(){
  try{
    while(port.readable&&keepReading){
      reader=port.readable.getReader();
      try{
        while(true){
          const {value,done}=await reader.read();
          if(done) break;
          if(!value||!value.length) continue;
          rxBuf+=new TextDecoder().decode(value);
          let i;
          while((i=rxBuf.indexOf('\r'))>=0){
            const line=rxBuf.slice(0,i); rxBuf=rxBuf.slice(i+1);
            if(pending){const p=pending;pending=null;clearTimeout(p.timer);p.resolve(line);}
          }
        }
      } finally { reader.releaseLock(); }
    }
  }catch(e){ if(keepReading) log('讀取中斷：'+e.message,'err'); }
}

// v0.7：同步改 UNIVERSAL（讓儀器自己適應畫面頻率，不再寫死 60Hz）、速度改 AUTO
const INIT=[
  ['COM,1','建立通訊'],
  ['SCS,3','同步 UNIVERSAL（自動適應畫面頻率）'],
  ['FSC,3','量測速度 AUTO'],
  ['OPR,1','選探頭 P1'],
  ['MMS,0','色彩＋閃爍'],
  ['FMS,0','FMA 法'],
  ['MDS,0','x,y,Lv 模式'],
  ['MCH,0','校正通道 0'],
  ['LUS,1','單位 cd/m²']
];
// MVS 要給一個設計值，它在 ±2Hz 內偵測。掃一輪常見更新率。
const HZ_GUESS=[60,75,90,100,120,144,165,180,200,240];

$('go').onclick=async()=>{
  $('go').disabled=true;
  samples=[]; wave=[]; logEl.innerHTML='';
  ['v-avg','v-max','v-lv','v-n'].forEach(i=>$(i).textContent='—');
  drawFMA(); drawWave();
  try{ await run(); }
  catch(e){ stage('出錯了','' + e.message,'err'); log('例外：'+e.message,'err'); }
  $('go').disabled=false;
};

async function run(){
  if(!('serial' in navigator)){ stage('這個瀏覽器不支援','請改用 Chrome 或 Edge。','err'); return; }

  // 1. 取埠
  stage('連線中…','正在找已授權的序列埠');
  let ports=await navigator.serial.getPorts();
  if(!ports.length){
    stage('請選擇序列埠','清單裡選 CA-410（Windows 是 COM 編號，Mac 是 usbmodem 開頭）');
    try{ port=await navigator.serial.requestPort(); }
    catch(e){ stage('沒有選埠','取消了，或清單裡沒有 CA-410。確認原廠 UI 已關閉、線有插好。','err'); return; }
  } else port=ports[0];
  const inf=port.getInfo();
  log('使用埠 vendorId=0x'+(inf.usbVendorId||0).toString(16)+' productId=0x'+(inf.usbProductId||0).toString(16),'info');

  // 2. 開埠
  try{
    if(!port.readable) await port.open({baudRate:38400,dataBits:8,stopBits:1,parity:'none'});
  }catch(e){
    if(/already open/i.test(e.message)){ /* 已開著，繼續 */ }
    else{ stage('埠打不開',e.message+'　→　多半是原廠 UI 還開著佔住它','err'); return; }
  }
  keepReading=true; rxBuf=''; readLoop();
  log('埠已開啟 38400','ok');

  // 3. 初始化
  for(let i=0;i<INIT.length;i++){
    const [c,why]=INIT[i];
    stage('設定中… '+(i+1)+'/'+INIT.length, why);
    let r=await cmd(c,6000);
    if(r===null){ stage('沒有回應','卡在 '+c+'。機器可能沒開、或鮑率不是 38400。','err'); return; }
    if(/^ER/.test(r) && c==='SCS,3'){
      log('UNIVERSAL 被拒，退回 INTERNAL 60Hz（這台可能不支援 UNIVERSAL）','warn');
      r=await cmd('SCS,4,60.00',6000);
    }
    if(/^ER/.test(r||'')){ stage('機器回錯誤 '+r, c+' 被拒絕。','err'); return; }
  }

  // 3.5 偵測畫面更新率（只是回報給人看，不影響 UNIVERSAL 同步）
  stage('偵測畫面更新率…','逐一試常見的更新率，找出畫面實際是幾 Hz');
  let hz=null;
  for(const guess of HZ_GUESS){
    const r=await cmd('MVS,'+guess,8000);
    if(r===null) continue;
    if(/^OK/.test(r)){
      const v=parseFloat(r.split(',')[1]);
      if(!isNaN(v)){ hz=v; break; }
    }
  }
  if(hz!==null){ $('v-hz').textContent=hz.toFixed(2); log('偵測到畫面更新率 '+hz+' Hz','ok'); }
  else{ $('v-hz').textContent='測不到'; log('MVS 掃過一輪都沒抓到，可能畫面是靜態的或不在常見更新率內。','warn'); }

  // 4. 零校正
  stage('零校正中，請蓋上遮光蓋','大約十秒，蓋著別動');
  const z=await cmd('ZRC',40000);
  if(z===null||/^ER/.test(z)){ stage('零校正失敗',(z||'逾時')+'　→　確認遮光蓋有蓋好再按一次','err'); return; }

  // 5. 提示打開
  for(let s=5;s>0;s--){
    stage('請打開遮光蓋、對準畫面','量測將在 '+s+' 秒後開始');
    await sleep(1000);
  }

  // 6. 連續量測 10 秒
  t0=performance.now();
  let bad=0;
  while((performance.now()-t0)/1000 < 10){
    const r=await cmd('MES,1',20000);
    if(r===null){ stage('量測逾時','已取得 '+samples.length+' 筆','err'); break; }
    if(/^ER/.test(r)){ if(++bad>=3){ stage('量測回錯誤 '+r,'連續三次，停止','err'); break; } continue; }
    bad=0;
    const p=r.split(',');
    const fma=parseFloat(p[6]), lv=parseFloat(p[5]);
    if(isNaN(fma)) continue;
    if(!samples.length) log('第一筆完整回應：'+r,'info');
    samples.push({t:(performance.now()-t0)/1000,fma:fma,lv:lv});
    drawFMA(); stats();
    stage('量測中…','已取得 '+samples.length+' 筆，剩 '+Math.max(0,10-Math.round((performance.now()-t0)/1000))+' 秒');
  }
  stats();

  // 7. 波形（失敗不影響前面的結果）
  stage('擷取波形中…','這一段是額外的，失敗也不影響上面的數字');
  await grabWave();

  // 8. 收工
  await cmd('COM,0',5000);
  keepReading=false;
  try{ if(reader) await reader.cancel(); }catch(e){}
  try{ await port.close(); }catch(e){}
  const n=samples.length;
  if(n) stage('測完了','共 '+n+' 筆。上面的數字和圖可以直接拍。','ok');
  else stage('沒有取到資料','詳細紀錄裡有每一步的原始回應，把那裡拍給我。','err');
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

async function grabWave(){
  const r=await cmd('WCS,0,0,10,1,1',10000);
  if(r===null||/^ER/.test(r)){ log('WCS 被拒或逾時，跳過波形。','warn'); return; }
  const m=await cmd('MES,1',25000);
  if(m===null||/^ER/.test(m)){ log('波形前的量測失敗，跳過。','warn'); return; }
  for(let b=0;b<80;b++){
    const res=await cmd('WDR,1,'+b,15000);
    if(res===null||/^ER/.test(res)) break;
    const vals=res.split(',').slice(2).map(Number).filter(v=>!isNaN(v));
    if(!vals.length) break;
    let stop=false;
    for(const v of vals){ if(v<=-999){stop=true;break;} wave.push(v); }
    if(stop) break;
  }
  log('波形取得 '+wave.length+' 點','ok');
  drawWave();
}

function stats(){
  if(!samples.length) return;
  const f=samples.map(s=>s.fma);
  const avg=f.reduce((a,b)=>a+b,0)/f.length;
  $('v-avg').textContent=avg.toFixed(3);
  $('v-max').textContent=Math.max(...f).toFixed(3);
  const lv=samples[samples.length-1].lv;
  $('v-lv').textContent=isNaN(lv)?'—':lv.toFixed(2);
  const dur=samples[samples.length-1].t;
  $('v-n').textContent=samples.length+' / '+(dur>0?(samples.length/dur).toFixed(0):'—');
}

function frame(cv){
  const dpr=window.devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;
  if(cv.width!==W*dpr||cv.height!==H*dpr){cv.width=W*dpr;cv.height=H*dpr;}
  const g=cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,W,H);
  return {g,W,H,L:60,R:12,T:16,B:26};
}
function axes(g,L,T,w,h,y0,y1,xlab,ylab,xfmt){
  g.font='11px ui-monospace,Menlo,monospace';
  for(let i=0;i<=4;i++){
    const yy=T+h*i/4,val=y1-(y1-y0)*i/4;
    g.strokeStyle='#16233d';g.beginPath();g.moveTo(L,yy);g.lineTo(L+w,yy);g.stroke();
    g.fillStyle='#64748b';g.textAlign='right';g.fillText(val.toFixed(3),L-6,yy+4);
  }
  g.textAlign='center';
  for(let i=0;i<=4;i++){
    const xx=L+w*i/4;
    g.strokeStyle='#16233d';g.beginPath();g.moveTo(xx,T);g.lineTo(xx,T+h);g.stroke();
    g.fillStyle='#64748b';g.fillText(xfmt(i/4),xx,T+h+15);
  }
  g.strokeStyle='#1e2d4d';g.strokeRect(L,T,w,h);
  g.fillStyle='#94a3b8';g.textAlign='left';g.fillText(ylab,L+4,T+11);
}
function drawFMA(){
  const cv=$('cv'),{g,W,H,L,R,T,B}=frame(cv),w=W-L-R,h=H-T-B;
  if(!samples.length){g.strokeStyle='#1e2d4d';g.strokeRect(L,T,w,h);
    g.fillStyle='#64748b';g.font='12px sans-serif';g.fillText('FMA 波形會顯示在這裡',L+10,T+22);return;}
  const ys=samples.map(s=>s.fma),xs=samples.map(s=>s.t);
  let y0=Math.min(...ys),y1=Math.max(...ys);
  const pad=Math.max((y1-y0)*0.2,0.01); y0-=pad;y1+=pad;
  const x1=Math.max(...xs)||1;
  axes(g,L,T,w,h,y0,y1,'秒','FMA (%)',f=>(x1*f).toFixed(1)+'s');
  g.strokeStyle='#38bdf8';g.lineWidth=1.8;g.beginPath();
  samples.forEach((s,i)=>{const px=L+s.t/x1*w,py=T+h-(s.fma-y0)/(y1-y0)*h;i?g.lineTo(px,py):g.moveTo(px,py);});
  g.stroke();
}
function drawWave(){
  const cv=$('cw'),{g,W,H,L,R,T,B}=frame(cv),w=W-L-R,h=H-T-B;
  if(!wave.length){g.strokeStyle='#1e2d4d';g.strokeRect(L,T,w,h);
    g.fillStyle='#64748b';g.font='12px sans-serif';g.fillText('亮度波形（WDR）會顯示在這裡，取不到就是空的',L+10,T+22);return;}
  let y0=Math.min(...wave),y1=Math.max(...wave);
  const pad=Math.max((y1-y0)*0.15,1e-9);y0-=pad;y1+=pad;
  axes(g,L,T,w,h,y0,y1,'點','亮度波形',f=>'#'+Math.round((wave.length-1)*f));
  g.strokeStyle='#a78bfa';g.lineWidth=1.5;g.beginPath();
  wave.forEach((v,i)=>{const px=L+i/(wave.length-1||1)*w,py=T+h-(v-y0)/(y1-y0)*h;i?g.lineTo(px,py):g.moveTo(px,py);});
  g.stroke();
}
window.addEventListener('resize',()=>{drawFMA();drawWave();});

$('btn-copy').onclick=()=>navigator.clipboard.writeText(logEl.innerText).then(()=>log('已複製','ok'));
$('btn-csv').onclick=()=>{
  const rows=[['time_s','FMA_percent','Lv']].concat(samples.map(s=>[s.t.toFixed(4),s.fma,s.lv]));
  if(wave.length){ rows.push([],['waveform_index','value']); wave.forEach((v,i)=>rows.push([i,v])); }
  const blob=new Blob([rows.map(r=>r.join(',')).join('\n')],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='flicker_'+new Date().toISOString().slice(0,19).replace(/[:T]/g,'')+'.csv';a.click();
};
drawFMA(); drawWave();
</script>
</body>
</html>
